# Smoke test: deployment.yaml iterates `env_resolved` (the structured
# list `rda render` produces from `suse-library.env:`) and emits the
# correct `valueFrom.secretKeyRef:` for kind=secret entries and
# `value:` for kind=value entries.
#
# Note: this file is loaded directly against the library-chart, so values
# are at the TOP level (not under suse-library:).
#
# We declare ONE binding (db / postgresql) so the binding-secret renders,
# then provide the env_resolved list directly — bypassing rda render
# (which is what `tilt up` would normally call). This isolates the
# library-chart's deployment.yaml iteration logic from the rda-cli
# resolver under test.
services:
  - binding: db
    type: postgresql
    auth:
      admin: { password: "admin" }
      user:
        name: app
        password: "pw"
        database: demo
    persistence: { enabled: false }

postgresql:
  enabled: true

# Mimics `rda render` output: 4 secret-ref env vars (the pure refs the
# dev wrote in suse-library.env) + 1 literal value (a composed URL
# the dev wrote with embedded ${binding:...} substitutions).
#
# After the Phase 2 workloads-dsl refactor, deployment.yaml iterates
# `.Values.workloads_resolved[].env_resolved`, so the env list lives
# under a workload entry rather than at the top level.
workloads_resolved:
  - name: web
    image:
      repository: nginx
      tag: latest
    env_resolved:
      - name: DB_HOST
        kind: secret
        secretRef: demo-db-binding
        secretKey: host
      - name: DB_USER          # The dev's chosen alias of `username` — no
        kind: secret           # more env_aliases magic; explicit in env block.
        secretRef: demo-db-binding
        secretKey: username
      - name: DB_USERNAME      # Same key, different env-var name (SBS
        kind: secret           # canonical). Both refs are valid; the dev
        secretRef: demo-db-binding   # picks which they want.
        secretKey: username
      - name: DB_PASSWORD
        kind: secret
        secretRef: demo-db-binding
        secretKey: password
      - name: DATABASE_URL
        kind: value
        value: "postgres://app:pw@demo-db-postgresql:5432/demo"
