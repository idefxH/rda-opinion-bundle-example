# Smoke test: prometheus binding renders a binding-secret with host/port/url,
# emits env vars (PROM_HOST, PROM_PORT, PROM_URL), and does NOT emit an
# auth-seed annotation (stateless from the auth perspective).
services:
  - binding: prom
    type: prometheus
    persistence:
      enabled: true
      size: 5Gi
    retention: "15d"
    ingress:
      enabled: false

prometheus:
  enabled: true

# Phase 2 (DO-0005): workloads_resolved replaces top-level env_resolved.
# Each workload carries its own env_resolved list.
workloads_resolved:
  - name: app
    image:
      repository: myapp
      tag: latest
    port: 8080
    resources:
      limits: {cpu: 500m, memory: 512Mi}
      requests: {cpu: 50m, memory: 128Mi}
    env_resolved:
      - name: PROM_HOST
        kind: secret
        secretRef: testrel-prom-binding
        secretKey: host
      - name: PROM_PORT
        kind: secret
        secretRef: testrel-prom-binding
        secretKey: port
      - name: PROM_URL
        kind: secret
        secretRef: testrel-prom-binding
        secretKey: url
