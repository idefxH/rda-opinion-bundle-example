# Smoke test: prometheus binding renders a binding-secret with host/port/url,
# emits env vars (PROM_HOST, PROM_PORT, PROM_URL), and does NOT emit an
# auth-seed annotation (stateless from the auth perspective).
services:
  - binding: prom
    type: prometheus
    persistence:
      enabled: true
      size: 5Gi
    retention: "15d"
    ingress:
      enabled: false

prometheus:
  enabled: true

# Phase 1 (DO 0001 Appendix A): the legacy auto-projection of every
# binding_secret key as <BINDING>_<KEY> is gone. The dev controls which
# env vars exist via env_resolved (produced by `rda render` from
# `suse-library.env`). For this test we provide env_resolved directly,
# simulating the rda render output.
env_resolved:
  - name: PROM_HOST
    kind: secret
    secretRef: testrel-prom-binding
    secretKey: host
  - name: PROM_PORT
    kind: secret
    secretRef: testrel-prom-binding
    secretKey: port
  - name: PROM_URL
    kind: secret
    secretRef: testrel-prom-binding
    secretKey: url
