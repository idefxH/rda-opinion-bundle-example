services:
  - binding: cache
    type: redis
    auth:
      password: dev-pw
  - binding: database
    type: postgresql
    auth:
      user:
        name: app
        password: dev-pw
        database: demo
    persistence:
      enabled: true
    passthrough:
      persistence:
        enabled: false

postgresql:
  enabled: true

redis:
  enabled: true
