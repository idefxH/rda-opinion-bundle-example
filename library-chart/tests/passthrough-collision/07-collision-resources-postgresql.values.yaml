services:
  - binding: database
    type: postgresql
    auth:
      user:
        name: app
        password: dev-pw
        database: demo
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    passthrough:
      podTemplates:
        containers:
          postgresql:
            resources:
              requests:
                cpu: 500m

postgresql:
  enabled: true
