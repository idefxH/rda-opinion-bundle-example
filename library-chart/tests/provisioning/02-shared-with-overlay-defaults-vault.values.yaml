# Lookup is by .type — the overlay must have defaults.shared_services[<type>].
# We use postgresql here as a stand-in for any chart the team has centralised
# in platform-services.
defaults:
  shared_services:
    postgresql:
      host: shared-pg.platform-services
      port: 5432
      scheme: tcp
services:
  - binding: shared-events-db
    type: postgresql
    provisioning: connect
    auth:
      user:
        name: app
        password: ignored
        database: ignored
