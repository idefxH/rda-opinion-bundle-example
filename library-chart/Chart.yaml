apiVersion: v2
name: suse-library
description: |
  SUSE Rancher Developer Access library chart. Encapsulates the
  application Deployment + Service + Service Binding Spec wiring AND
  references the SUSE Application Collection charts that projects can
  opt into via `<chart-name>.enabled: true` in their values.

  Convention: every dep is the AppCo chart name verbatim. No alias.
  This scales to AppCo's full catalogue (postgresql, mariadb,
  cloudnative-pg, milvus, redis, prometheus, grafana, ...) and avoids
  collisions when a project pulls in two SQL DBs side by side.

  Resources deploy as <release>-<chart-name>. The binding-secret name
  is <release>-<chart-name>-binding. The /bindings/<chart-name>/ mount
  point follows the same name. 12-factor env vars use the chart name
  uppercased as a prefix (POSTGRESQL_HOST, PROMETHEUS_URL, etc.) plus
  semantic aliases for portable libraries (DB_HOST when a SQL chart
  is enabled).
type: application
version: 0.11.17
appVersion: "1.0"
keywords: [suse, rda, library, service-binding, application-collection]
home: https://github.com/idefxH/rda-opinion-bundle-example
maintainers: [{name: idefxH, email: fx.houard@gmail.com}]

# Approved AppCo charts. As we add more (mariadb, redis, milvus, ...),
# they're appended here verbatim with their AppCo chart name.
#
# Note: AppCo OCI tags (e.g. "0.4.4-29.1") differ from each chart's
# internal Chart.yaml version (e.g. "0.4.4"). Helm dep-matching uses
# the INTERNAL version, so the dep silently fails to resolve at
# template time. The Tilt extension's _align_subchart_versions.py
# post-processor rewrites every pulled tgz to align internal version
# with declared version. Drop that workaround when AppCo aligns
# version<->tag for every chart in their catalogue.
dependencies:
  - name: postgresql
    version: "0.4.4-29.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: postgresql.enabled
  - name: prometheus
    version: "29.3.0-7.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: prometheus.enabled
  - name: grafana
    version: "12.2.1-8.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: grafana.enabled
  - name: redis
    version: "2.6.1-3.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: redis.enabled
  # dex/dex (OIDC + OAuth2) — upstream chart, not AppCo. The AppCo
  # catalogue (as of 2026-04) does NOT include an OIDC IdP, so we pull
  # from charts.dexidp.io directly. Same shape as the other deps:
  # condition-gated by <chart>.enabled. The internal version aligns
  # with the upstream tag for dexidp's chart, so the Tilt extension's
  # _align_subchart_versions workaround is a no-op for this dep.
  - name: dex
    version: "0.24.0"
    repository: https://charts.dexidp.io
    condition: dex.enabled
  - name: mariadb
    version: "0.1.7-10.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: mariadb.enabled
  - name: apache-kafka
    version: "1.3.0-11.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: apache-kafka.enabled
  # valkey/minio/vault — added in 0.11.17 to round out the catalog
  # towards the AppCo charts most projects ask for. valkey is the
  # open-source Redis fork (same DSL surface as redis); minio is
  # S3-compatible object storage; vault is HashiCorp's secrets engine
  # in dev-mode posture.
  - name: valkey
    version: "0.11.5-6.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: valkey.enabled
  - name: minio
    version: "5.4.0-11.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: minio.enabled
  - name: vault
    version: "0.32.0-1.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: vault.enabled
