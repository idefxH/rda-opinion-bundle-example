apiVersion: v2
name: suse-library
description: |
  SUSE Rancher Developer Access library chart. Encapsulates the
  application Deployment + Service + Service Binding Spec wiring and
  references the SUSE Application Collection charts that projects opt
  into via `services[]` entries in their deploy/values.yaml.

  Each `services[]` entry produces:
    - a binding-secret named <release>-<binding>-binding
    - mounted at /bindings/<binding>/<key> in the app pod
    - 12-factor env vars projected as <BINDING>_HOST/PORT/URL/...

  Multi-port charts (minio, dex) also project per-port keys
  <BINDING>_<PORT_NAME>_HOST/PORT/URL.

  See rda-docs/concepts/dsl.md for the full DSL contract.
type: application
version: 0.11.26
appVersion: "1.0"
keywords: [suse, rda, library, service-binding, application-collection]
home: https://github.com/idefxH/rda-opinion-bundle-example
maintainers: [{name: idefxH, email: fx.houard@gmail.com}]

# Catalogued sub-charts. Adding a chart = one entry here + one
# `<name>.enabled: false` default in values.yaml + one chart entry
# in dsl-mappings.yaml (with values_mapping + binding_secret +
# scaffold table). No rda-cli release needed.
#
# Note: AppCo OCI tags (e.g. "0.4.4-29.1") differ from each chart's
# internal Chart.yaml version (e.g. "0.4.4"). Helm dep-matching uses
# the INTERNAL version, so the Tilt extension's
# _align_subchart_versions.py post-processor rewrites every pulled
# tgz to align internal version with declared version.
dependencies:
  - name: postgresql
    version: "0.4.4-29.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: postgresql.enabled
  - name: prometheus
    version: "29.3.0-7.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: prometheus.enabled
  - name: grafana
    version: "12.2.1-8.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: grafana.enabled
  - name: redis
    version: "2.6.1-3.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: redis.enabled
  # dex (OIDC + OAuth2) via SUSE Application Collection.
  #
  #   - The upstream dex Helm chart at charts.dexidp.io is published
  #     by the dex maintainers; AppCo packages the same chart as
  #     `dex-idp` (chart name + scanned image). Switching to AppCo
  #     gives us a single registry for everything (postgres, redis,
  #     dex, ...) — no separate HTTP repo to bootstrap, image scanned
  #     by SUSE, supported commercially.
  #
  #   - `alias: dex` keeps the on-disk dependency dir at
  #     deploy/charts/dex/, and the chart's _helpers.tpl uses
  #     `dex.fullname` (NOT `dex-idp.fullname` — checked in 0.24.0).
  #     With the alias, .Chart.Name = "dex" inside the chart's
  #     templates, so resource names stay <release>-dex (matching
  #     dsl-mappings.yaml's service.host = {{ .Release.Name }}-dex).
  #     User-facing values.yaml API is unchanged: still .dex.* under
  #     suse-library: namespace.
  #
  # Internal version aligns with the upstream tag (AppCo follows
  # upstream) so Tilt's _align_subchart_versions is a no-op.
  - name: dex-idp
    alias: dex
    version: "0.24.0"
    repository: oci://dp.apps.rancher.io/charts
    condition: dex.enabled
  - name: mariadb
    version: "0.1.7-10.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: mariadb.enabled
  - name: apache-kafka
    version: "1.3.0-11.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: apache-kafka.enabled
  # valkey/minio/vault — added in 0.11.17 to round out the catalog
  # towards the AppCo charts most projects ask for. valkey is the
  # open-source Redis fork (same DSL surface as redis); minio is
  # S3-compatible object storage; vault is HashiCorp's secrets engine
  # in dev-mode posture.
  - name: valkey
    version: "0.11.5-6.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: valkey.enabled
  - name: minio
    version: "5.4.0-11.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: minio.enabled
  - name: vault
    version: "0.32.0-1.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: vault.enabled
