apiVersion: v2
name: suse-library
description: |
  SUSE Rancher Developer Access library chart. Encapsulates the
  application Deployment + Service + Service Binding Spec wiring and
  references the SUSE Application Collection charts that projects opt
  into via `services[]` entries in their deploy/values.yaml.

  Each `services[]` entry produces:
    - a binding-secret named <release>-<binding>-binding
    - mounted at /bindings/<binding>/<key> in the app pod
    - 12-factor env vars projected as <BINDING>_HOST/PORT/URL/...

  Multi-port charts (minio, dex) also project per-port keys
  <BINDING>_<PORT_NAME>_HOST/PORT/URL.

  See rda-docs/concepts/dsl.md for the full DSL contract.
type: application
version: 0.16.0
appVersion: "1.0"
keywords: [suse, rda, library, service-binding, application-collection]
home: https://github.com/idefxH/rda-opinion-bundle-example
maintainers: [{name: idefxH, email: fx.houard@gmail.com}]

# Catalogued sub-charts. Adding a chart = one entry here + one
# `<name>.enabled: false` default in values.yaml + one chart entry
# in dsl-mappings.yaml (with values_mapping + binding_secret +
# scaffold table). No rda-cli release needed.
#
# Note: AppCo OCI tags (e.g. "0.4.4-29.1") differ from each chart's
# internal Chart.yaml version (e.g. "0.4.4"). Helm dep-matching uses
# the INTERNAL version, so the Tilt extension's
# _align_subchart_versions.py post-processor rewrites every pulled
# tgz to align internal version with declared version.
  # Community-first baseline: every chart with a community source
  # uses the upstream helm repo here. `rda upgrade --source appco`
  # rewrites repos to OCI AppCo refs + adjusts chart names/versions.
  # Charts without a community source (postgresql, redis, mariadb,
  # kafka, valkey, etcd) stay on AppCo OCI — they require a SUSE
  # Application Collection subscription.
dependencies:
  # ── AppCo-only charts (no community equivalent) ──
  - name: postgresql
    version: "0.4.4-29.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: postgresql.enabled
  - name: redis
    version: "2.6.1-3.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: redis.enabled
  - name: mariadb
    version: "0.1.7-10.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: mariadb.enabled
  - name: apache-kafka
    version: "1.3.0-11.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: apache-kafka.enabled
  - name: valkey
    version: "0.11.5-6.1"
    repository: oci://dp.apps.rancher.io/charts
    condition: valkey.enabled
  - name: etcd
    version: "0.3.16"
    repository: oci://dp.apps.rancher.io/charts
    condition: etcd.enabled
  # ── Community-baseline charts (AppCo overlay available) ──
  - name: prometheus
    version: "29.3.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "10.5.15"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: dex
    version: "0.24.0"
    repository: https://charts.dexidp.io
    condition: dex.enabled
  - name: minio
    version: "5.4.0"
    repository: https://charts.min.io
    condition: minio.enabled
  - name: vault
    version: "0.32.0"
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled
  - name: nats
    version: "2.12.6"
    repository: https://nats-io.github.io/k8s/helm/charts
    condition: nats.enabled
  - name: opensearch
    version: "3.6.0"
    repository: https://opensearch-project.github.io/helm-charts
    condition: opensearch.enabled
  - name: influxdb
    version: "2.1.2"
    repository: https://helm.influxdata.com
    condition: influxdb.enabled
  - name: harbor
    version: "1.18.3"
    repository: https://helm.goharbor.io
    condition: harbor.enabled
  - name: apache-airflow
    version: "1.21.0"
    repository: https://airflow.apache.org
    condition: apache-airflow.enabled
  - name: oauth2-proxy
    version: "10.4.3"
    repository: https://oauth2-proxy.github.io/manifests
    condition: oauth2-proxy.enabled
  # ── CloudNativePG ──
  # Operator only — installs CRDs + controller. The Cluster CR is
  # rendered by the library chart template (cnpg-cluster.yaml) from
  # the DSL values, not by a sub-chart. This keeps everything in
  # AppCo (operator chart) and fully overridable via passthrough.
  - name: cloudnative-pg
    version: "0.28.2"
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
