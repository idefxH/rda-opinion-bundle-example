{{- /*
  ingress.yaml — Multi-workload Ingress renderer (Design Orientation 0005).

  Only generates rules for workloads that have BOTH a port AND
  ingress.hosts defined. Each workload's ingress.hosts routes to that
  workload's Service (<release>-<workload.name>).

  Global ingress settings (className, annotations, tls) come from
  .Values.ingress at chart level.
*/ -}}
{{- if .Values.ingress.enabled -}}
{{- $hasAnyHosts := false -}}
{{- range $wl := .Values.workloads_resolved | default list -}}
  {{- if and $wl.port (index ($wl.ingress | default dict) "hosts") -}}
    {{- $hasAnyHosts = true -}}
  {{- end -}}
{{- end -}}
{{- if $hasAnyHosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $wl := .Values.workloads_resolved | default list }}
    {{- if and $wl.port (index ($wl.ingress | default dict) "hosts") }}
    {{- $wlName := printf "%s-%s" (include "suse-library.name" $) $wl.name }}
    {{- range $wl.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ index ($wl.ingress | default dict) "path" | default $.Values.ingress.path | default "/" }}
            pathType: {{ index ($wl.ingress | default dict) "pathType" | default $.Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $wlName }}
                port:
                  number: 80
    {{- end }}
    {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end -}}
