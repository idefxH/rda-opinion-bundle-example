{{- /*
  service.yaml — Multi-workload Service renderer (Design Orientation 0005).

  One Service per workload that has a non-null port. Workers, crons, and
  other port-less workloads are skipped. Named <release>-<workload.name>.

  Binding-level services (sub-chart Services) are unaffected — they're
  rendered by the sub-charts themselves.
*/ -}}
{{- range $wl := .Values.workloads_resolved | default list }}
{{- if $wl.port }}
{{- $wlName := printf "%s-%s" (include "suse-library.name" $) $wl.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $wlName }}
  labels:
    {{- include "suse-library.labels" $ | nindent 4 }}
    rda.suse.com/workload: {{ $wl.name | quote }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "suse-library.selectorLabels" $ | nindent 4 }}
    rda.suse.com/workload: {{ $wl.name | quote }}
{{- end }}
{{- end }}
