{{- /*
    Service rendering toggle. Defaults to true (web shapes always
    expose a Service); workers / batch templates flip
    `service.enabled: false` to skip the resource entirely. The
    Deployment / binding-secret / Ingress decisions are independent —
    Ingress also defaults off, but service-off is the rarer case
    (workers without inbound traffic). Bundle 0.11.16+.

    `dig` walks an optional path through .Values; the third arg is the
    fallback when any segment is missing. Equivalent to
    `(default true .Values.service.enabled)` but tolerates the whole
    `service:` block being absent (most projects don't write one).
*/}}
{{- if (dig "service" "enabled" true .Values) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "suse-library.selectorLabels" . | nindent 4 }}
{{- end }}
