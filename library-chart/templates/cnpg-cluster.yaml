{{/*
  CNPG Cluster CR — rendered when cnpg is enabled.
  All spec fields come from the DSL projection under cnpg.cluster.*.
  Fully overridable via passthrough.

  Two safety layers guarantee password synchronization:
  1. bootstrap.initdb.secret.name always set → correct password at bootstrap
  2. managed.roles → continuous reconciliation from binding secret
*/}}
{{- $cnpg := .Values.cnpg | default dict -}}
{{- if $cnpg.enabled }}
{{- $cluster := $cnpg.cluster | default dict -}}
{{- $binding := "" -}}
{{- range $svc := (.Values.services | default list) -}}
  {{- if eq (default "" $svc.type) "cnpg" -}}
    {{- $binding = default "db" $svc.binding -}}
  {{- end -}}
{{- end -}}
{{- $spec := deepCopy $cluster -}}
{{- $owner := dig "bootstrap" "initdb" "owner" "app" $spec -}}
{{- $secretName := printf "%s-%s-binding" .Release.Name $binding -}}
{{- /* Layer 1: guarantee bootstrap.initdb.secret.name is always set */ -}}
{{- if not (dig "bootstrap" "initdb" "secret" "name" "" $spec) -}}
  {{- $bootstrap := default dict (get $spec "bootstrap") -}}
  {{- $initdb := default dict (get $bootstrap "initdb") -}}
  {{- $_ := set $initdb "secret" (dict "name" $secretName) -}}
  {{- $_ := set $bootstrap "initdb" $initdb -}}
  {{- $_ := set $spec "bootstrap" $bootstrap -}}
{{- end -}}
{{- /* Layer 2: managed.roles — continuous password reconciliation */ -}}
{{- $role := dict "name" $owner "ensure" "present" "login" true "passwordSecret" (dict "name" $secretName) -}}
{{- $managed := default dict (get $spec "managed") -}}
{{- $existingRoles := default list (get $managed "roles") -}}
{{- $_ := set $managed "roles" (append $existingRoles $role) -}}
{{- $_ := set $spec "managed" $managed -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-cnpg
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if $binding }}
    rda.suse.com/binding: {{ $binding }}
    {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
