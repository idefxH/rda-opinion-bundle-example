{{/*
Service Binding Specification secrets, one per declared binding.
Mounted at /bindings/<key>/ in the application container by deployment.yaml.
*/}}
{{- range $name, $binding := .Values.bindings }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suse-library.name" $ }}-{{ $name }}-binding
  labels:
    {{- include "suse-library.labels" $ | nindent 4 }}
    service.binding/binding-name: {{ $name }}
type: Opaque
stringData:
{{- range $key, $value := $binding }}
  {{ $key }}: {{ tpl (printf "%v" $value) $ | quote }}
{{- end }}
{{- end }}
