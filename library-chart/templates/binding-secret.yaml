{{/*
  Service Binding Spec secrets.

  One Secret per ENABLED services[] entry, named <release>-<binding>-binding.
  Helpers in _helpers.tpl handle per-type field shapes — driven from
  dsl-mappings.yaml (postgresql, redis, valkey, mariadb, apache-kafka,
  prometheus, grafana, dex, minio, vault, ...).

  Convention :
    Secret      : <release>-<binding>-binding
    SBS mount   : /bindings/<binding>/<key> (in the app pod)
    Host        : the AppCo sub-chart's deployed Service name
    Keys        : type, provider, host, port, [username, password, database, url, adminUser, adminPassword, ...]
    Multi-port  : per-port keys <port_name>_host / _port / _url
*/}}

{{- /* DSL consistency check first — fails loud on drift */ -}}
{{- include "suse-library.dsl.validateConsistency" . -}}
{{- /* DSL ↔ passthrough collision check — fails loud, see #37 */ -}}
{{- include "suse-library.dsl.validatePassthrough" . -}}

{{/* Render one binding-secret per ENABLED services[] entry. The
     `{{ include }}` (no leading dash) preserves the leading newline
     before the include — without it, consecutive iterations glue
     `database: "x"` onto the next `---` and YAML parsing breaks.

     Disabled entries (services[].enabled: false) are skipped — they're
     scaffolds the dev hasn't activated yet. No binding-secret means
     the app pod will fail loud at start-up if it accidentally
     references a disabled binding (better than silently pointing at
     an empty endpoint). The chart-level <chart>.enabled flag is
     derived by `rda render` and lives only in
     .rda/values.generated.yaml; users don't write or see it. */}}
{{- $enabled := include "suse-library.dsl.enabledServices" $ | fromJsonArray }}
{{- range $i, $svc := $enabled }}
{{ include "suse-library.dsl.bindingSecretFrom" (dict "svc" $svc "root" $) }}
{{- end }}
