{{/*
  Service Binding Spec secrets.

  Two render paths in Phase 1 :
    1. DSL path : when .Values.services is non-empty, render one
       binding-secret per services[] entry, named <release>-<binding>-binding.
       Helpers in _helpers.tpl handle per-type field shapes (postgresql,
       redis, grafana, ...).
    2. Legacy path : when .Values.services is empty, render the historical
       <release>-<chart>-binding secrets, gated by .Values.<chart>.enabled.
       Backward compatible with bundles <= v0.9.

  Phase 1.5 (rda CLI pre-processor) will normalize: the DSL becomes the
  single source of truth and the legacy blocks are auto-generated.

  Convention details :
    Secret      : <release>-<binding>-binding (DSL) or <release>-<chart>-binding (legacy)
    SBS mount   : /bindings/<binding>/<key> (in the app pod)
    Host points : the AppCo sub-chart's deployed Service name
    Keys        : type, provider, host, port, [username, password, database, url, adminUser, adminPassword]
*/}}

{{- /* DSL consistency check first — fails loud on drift */ -}}
{{- include "suse-library.dsl.validateConsistency" . -}}
{{- /* DSL ↔ passthrough collision check — fails loud, see #37 */ -}}
{{- include "suse-library.dsl.validatePassthrough" . -}}

{{- if .Values.services -}}

{{/* DSL path: render one binding-secret per services[] entry. The
     `{{ include }}` (no leading dash) preserves the leading newline before
     the include — without it, consecutive iterations glue `database: "x"`
     onto the next `---` and YAML parsing breaks. */}}
{{- range $i, $svc := .Values.services }}
{{ include "suse-library.dsl.bindingSecretFrom" (dict "svc" $svc "root" $) }}
{{- end }}

{{- else -}}

{{/*
  Legacy path: gated by per-chart enabled flag. Each Secret is emitted via
  a category helper (issue #5) — sql-db, url-only, ui-with-admin. New legacy
  charts plug in by adding a single line below alongside their values.yaml
  block; no copy-paste of the full Secret shape.
*/}}

{{- if .Values.postgresql.enabled }}
{{ include "suse-library.legacy.sqlBindingSecret" (dict "chart" "postgresql" "port" "5432" "hostSvc" (printf "%s-postgresql" .Release.Name) "root" .) }}
{{- end }}

{{- if .Values.prometheus.enabled }}
{{ include "suse-library.legacy.urlBindingSecret" (dict "chart" "prometheus" "port" "80" "hostSvc" (printf "%s-prometheus-server" .Release.Name) "root" .) }}
{{- end }}

{{- if .Values.grafana.enabled }}
{{ include "suse-library.legacy.uiBindingSecret" (dict "chart" "grafana" "port" "80" "hostSvc" (printf "%s-grafana" .Release.Name) "adminUser" "admin" "adminField" "adminPassword" "root" .) }}
{{- end }}

{{- end -}}
