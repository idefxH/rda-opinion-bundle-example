{{/*
  Service Binding Specification secrets, one per enabled service.

  Each Secret is mounted at /bindings/<binding-name>/ in the app
  container by deployment.yaml. Apps that follow the SBS contract
  read /bindings/<name>/<key> directly. Apps that use 12-factor env
  vars get the same values projected as DB_*/PROMETHEUS_*/GRAFANA_*
  via deployment.yaml (additive, both work).

  The host always points at <release>-<alias>, which is what the
  AppCo sub-chart actually deploys (alias resolution renames
  resources accordingly — provided the Tilt extension's
  chart-version alignment workaround is in place).
*/}}

{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suse-library.name" . }}-database-binding
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
    service.binding/binding-name: database
    service.binding/binding-type: postgresql
type: Opaque
stringData:
  type: postgresql
  provider: rda-appco
  host: "{{ .Release.Name }}-database"
  port: "5432"
  username: {{ required "database.auth.username is required when database.enabled=true" .Values.database.auth.username | quote }}
  password: {{ required "database.auth.password is required when database.enabled=true" .Values.database.auth.password | quote }}
  database: {{ required "database.auth.database is required when database.enabled=true" .Values.database.auth.database | quote }}
{{- end }}

{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suse-library.name" . }}-metrics-binding
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
    service.binding/binding-name: metrics
    service.binding/binding-type: prometheus
type: Opaque
stringData:
  type: prometheus
  provider: rda-appco
  # AppCo Prometheus chart exposes the API server on port 9090 via a
  # ClusterIP service named <release>-<alias>-server.
  host: "{{ .Release.Name }}-metrics-server"
  port: "9090"
  url: "http://{{ .Release.Name }}-metrics-server:9090"
{{- end }}

{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suse-library.name" . }}-dashboard-binding
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
    service.binding/binding-name: dashboard
    service.binding/binding-type: grafana
type: Opaque
stringData:
  type: grafana
  provider: rda-appco
  host: "{{ .Release.Name }}-dashboard"
  port: "3000"
  url: "http://{{ .Release.Name }}-dashboard:3000"
  adminUser: {{ required "dashboard.adminUser is required when dashboard.enabled=true" .Values.dashboard.adminUser | quote }}
  adminPassword: {{ required "dashboard.adminPassword is required when dashboard.enabled=true" .Values.dashboard.adminPassword | quote }}
{{- end }}
