        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $wl.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $wl.name }}
          image: "{{ $wl.image.repository }}:{{ $wl.image.tag }}"
          imagePullPolicy: {{ $wl.image.pullPolicy | default "IfNotPresent" }}
          {{- if $wl.port }}
          ports:
            - {name: http, containerPort: {{ $wl.port }}}
          {{- end }}
          env:
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            {{- if $wl.port }}
            - {name: PORT, value: "{{ $wl.port }}"}
            {{- end }}
            {{- range $entry := $wl.env_resolved | default list }}
            - name: {{ index $entry "name" }}
              {{- if eq (index $entry "kind") "secret" }}
              valueFrom:
                secretKeyRef:
                  name: {{ index $entry "secretRef" }}
                  key: {{ index $entry "secretKey" }}
              {{- else }}
              value: {{ index $entry "value" | quote }}
              {{- end }}
            {{- end }}
          volumeMounts:
            {{- range $i, $svc := $enabled }}
            {{- $prov := $svc.provisioning | default "deploy" }}
            {{- $ep := $svc.credentials | default dict }}
            {{- $secretRef := index $ep "secretRef" | default "" }}
            {{- if or (and (ne $prov "connect") (ne $prov "external")) (ne $secretRef "") }}
            - {name: {{ printf "binding-%s" $svc.binding }}, mountPath: {{ printf "/bindings/%s" $svc.binding }}, readOnly: true}
            {{- end }}
            {{- end }}
            {{- with $wl.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $wl.probes }}
          {{- with .liveness }}
          livenessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .readiness }}
          readinessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- end }}
          {{- with $wl.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml ($wl.resources | default dict) | nindent 12 }}
        {{- range $sc := $wl.sidecars | default list }}
        - name: {{ $sc.name }}
          image: {{ $sc.image }}
          {{- with $sc.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.env }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.volumeMounts }}
          volumeMounts: {{ toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        {{- range $i, $svc := $enabled }}
        {{- $prov := $svc.provisioning | default "deploy" }}
        {{- $ep := $svc.credentials | default dict }}
        {{- $secretRef := index $ep "secretRef" | default "" }}
        {{- if and (ne $prov "connect") (ne $prov "external") }}
        - name: {{ printf "binding-%s" $svc.binding }}
          secret: {secretName: {{ printf "%s-%s-binding" (include "suse-library.name" $) $svc.binding }}}
        {{- else if ne $secretRef "" }}
        - name: {{ printf "binding-%s" $svc.binding }}
          secret: {secretName: {{ $secretRef }}}
        {{- end }}
        {{- end }}
        {{- with $wl.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $wlName }}
  labels:
    {{- include "suse-library.labels" $ | nindent 4 }}
    rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
spec:
  replicas: {{ $wl.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" $ | nindent 6 }}
      rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" $ | nindent 8 }}
        rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
      annotations:
        checksum/services: {{ $.Values.services | toJson | sha256sum }}
        {{- with $wl.metrics }}
        {{- if .enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .path | quote }}
        prometheus.io/port: {{ .port | default $wl.port | quote }}
        {{- end }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $wl.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $wl.name }}
          image: "{{ $wl.image.repository }}:{{ $wl.image.tag }}"
          imagePullPolicy: {{ $wl.image.pullPolicy | default "IfNotPresent" }}
          {{- if $wl.port }}
          ports:
            - {name: http, containerPort: {{ $wl.port }}}
          {{- end }}
          env:
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            {{- if $wl.port }}
            - {name: PORT, value: "{{ $wl.port }}"}
            {{- end }}
            {{- range $entry := $wl.env_resolved | default list }}
            - name: {{ index $entry "name" }}
              {{- if eq (index $entry "kind") "secret" }}
              valueFrom:
                secretKeyRef:
                  name: {{ index $entry "secretRef" }}
                  key: {{ index $entry "secretKey" }}
              {{- else }}
              value: {{ index $entry "value" | quote }}
              {{- end }}
            {{- end }}
          volumeMounts:
            {{- range $i, $svc := $enabled }}
            {{- $prov := $svc.provisioning | default "deploy" }}
            {{- $ep := $svc.credentials | default dict }}
            {{- $secretRef := index $ep "secretRef" | default "" }}
            {{- if or (and (ne $prov "connect") (ne $prov "external")) (ne $secretRef "") }}
            - {name: {{ printf "binding-%s" $svc.binding }}, mountPath: {{ printf "/bindings/%s" $svc.binding }}, readOnly: true}
            {{- end }}
            {{- end }}
            {{- with $wl.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $wl.probes }}
          {{- with .liveness }}
          livenessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .readiness }}
          readinessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- end }}
          {{- with $wl.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml ($wl.resources | default dict) | nindent 12 }}
        {{- range $sc := $wl.sidecars | default list }}
        - name: {{ $sc.name }}
          image: {{ $sc.image }}
          {{- with $sc.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.env }}
