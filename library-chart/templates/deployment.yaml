apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/services: {{ .Values.services | toJson | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: {{ .Values.metrics.port | default .Values.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            # Service Binding Spec mount root.
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            # 12-factor PORT — user code MUST respect process.env.PORT.
            - {name: PORT, value: "{{ .Values.port }}"}
            {{- /* DSL Phase 1 (Design Orientation 0001 Appendix A): emit env
                   vars from `.Values.env_resolved` — the structured list
                   `rda render` (rda-cli 0.1.52+) produces from the dev's
                   `suse-library.env:` block. Each entry carries `name`,
                   `kind` (secret|value), and either `secretRef`+`secretKey`
                   or `value`. The set is exactly what the dev declared —
                   no surprise auto-projection. Empty/absent list is a
                   valid no-op (workloads that don't read any binding). */ -}}
            {{- $enabled := include "suse-library.dsl.enabledServices" $ | fromJsonArray }}
            {{- range $entry := .Values.env_resolved | default list }}
            - name: {{ index $entry "name" }}
              {{- if eq (index $entry "kind") "secret" }}
              valueFrom:
                secretKeyRef:
                  name: {{ index $entry "secretRef" }}
                  key: {{ index $entry "secretKey" }}
              {{- else }}
              value: {{ index $entry "value" | quote }}
              {{- end }}
            {{- end }}
          volumeMounts:
            {{- /*
                DSL binding mounts. Each services[] entry that isn't
                `provisioning: connect` mounts its binding-secret at
                /bindings/<binding>/, so apps following the Service Binding
                Spec convention find their credentials there. external
                services have no Secret to mount (the dev wired the
                connection details elsewhere).
            */}}
            {{- range $i, $svc := $enabled }}
            {{- $prov := $svc.provisioning | default "deploy" }}
            {{- $ep := $svc.credentials | default dict }}
            {{- $secretRef := index $ep "secretRef" | default "" }}
            {{- if or (and (ne $prov "connect") (ne $prov "external")) (ne $secretRef "") }}
            - {name: {{ printf "binding-%s" $svc.binding }}, mountPath: {{ printf "/bindings/%s" $svc.binding }}, readOnly: true}
            {{- end }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            Probes are conditionally rendered. Setting probes.liveness or
            probes.readiness to null in values.yaml skips the corresponding
            probe field on the container — needed for worker / batch shapes
            that don't expose HTTP /health or /ready endpoints. Web shapes
            keep both populated by default. Bundle 0.11.16+.
          */}}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
        {{- /* DO-0004 Phase 3b: sidecar containers injected by rda render
               from services[] entries with inject: sidecar. Each entry in
               .Values.sidecars becomes an additional container in this pod.
               The sidecar shares the pod's network namespace and volumes. */ -}}
        {{- range $sc := .Values.sidecars | default list }}
        - name: {{ $sc.name }}
          image: {{ $sc.image }}
          {{- with $sc.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.env }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.volumeMounts }}
          volumeMounts: {{ toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        {{- /*
            DSL binding volumes — one Secret-backed volume per non-external
            services[] entry. Pairs with the volumeMounts loop above.
        */}}
        {{- range $i, $svc := $enabled }}
        {{- $prov := $svc.provisioning | default "deploy" }}
        {{- $ep := $svc.credentials | default dict }}
        {{- $secretRef := index $ep "secretRef" | default "" }}
        {{- if and (ne $prov "connect") (ne $prov "external") }}
        - name: {{ printf "binding-%s" $svc.binding }}
          secret: {secretName: {{ printf "%s-%s-binding" (include "suse-library.name" $) $svc.binding }}}
        {{- else if ne $secretRef "" }}
        - name: {{ printf "binding-%s" $svc.binding }}
          secret: {secretName: {{ $secretRef }}}
        {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
