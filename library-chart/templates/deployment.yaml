apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            - {name: PORT, value: "{{ .Values.port }}"}
            {{- if .Values.database.enabled }}
            # Convenience aliases for the database binding so apps that
            # follow the 12-factor convention (DB_HOST, DB_USER, etc.)
            # work out of the box. Apps that prefer the Service Binding
            # Spec can ignore these and read /bindings/database/ directly.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: database
            {{- end }}
          volumeMounts:
            {{- if .Values.database.enabled }}
            - name: binding-database
              mountPath: /bindings/database
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: http}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: http}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.database.enabled }}
        - name: binding-database
          secret:
            secretName: {{ include "suse-library.name" . }}-database-binding
        {{- end }}
