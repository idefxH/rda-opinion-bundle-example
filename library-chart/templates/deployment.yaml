apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" . | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: {{ .Values.metrics.port | default .Values.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            # Service Binding Spec mount root.
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            # 12-factor PORT — user code MUST respect process.env.PORT.
            - {name: PORT, value: "{{ .Values.port }}"}
            {{- /* DSL path: project env from each ENABLED services[] entry.
                   Iterates the same enabledServices helper as binding-secret.yaml
                   so a disabled service doesn't end up with envFromBinding /
                   volumeMounts referencing a Secret that was never rendered.
                   Live e2e Apr 30: a prometheus service scaffolded with
                   `enabled: false` had the deployment mount /bindings/metrics
                   while binding-secret.yaml correctly skipped it → pod
                   MountVolume.SetUp failed with `secret payments-metrics-binding
                   not found`. Single source of truth fixes the drift. */ -}}
            {{- $enabled := include "suse-library.dsl.enabledServices" $ | fromJsonArray }}
            {{- range $i, $svc := $enabled }}
            # ─── DSL binding {{ $svc.binding }} (type {{ $svc.type }}) ───
            {{- include "suse-library.dsl.envFromBinding" (dict "svc" $svc "release" $.Release.Name "root" $) | nindent 12 }}
            {{- end }}
            {{- /*
                Legacy bindings (one block per chart). Each `if` arm calls a
                category helper from _helpers.tpl (issue #5). The whole
                legacy block is gated on `not services` so it doesn't double
                up with the DSL path's env vars when both layers fire (the
                DSL path's binding-secret has different keys + name shape
                than the legacy one, so duplicate env names referencing
                different Secrets would crash on render). Mirrors the
                either/or branch in binding-secret.yaml.
            */}}
            {{- if not .Values.services }}
            {{- if .Values.postgresql.enabled }}
            # ─── postgresql binding (12-factor projection, sql-db category) ───
            # Apps that prefer SBS read /bindings/postgresql/<key> instead.
            # Both <CHART>_* (verbose, unambiguous) and DB_* (semantic
            # alias for portable SQL libs like Sequelize, Prisma, pg)
            # are projected from the same Secret.
            {{- include "suse-library.legacy.envForSqlDb" (dict "chart" "postgresql" "release" (include "suse-library.name" .)) | nindent 12 }}
            {{- end }}
            {{- if .Values.prometheus.enabled }}
            # ─── prometheus binding (12-factor projection, url-only category) ───
            {{- include "suse-library.legacy.envForUrlOnly" (dict "chart" "prometheus" "release" (include "suse-library.name" .)) | nindent 12 }}
            {{- end }}
            {{- if .Values.grafana.enabled }}
            # ─── grafana binding (12-factor projection, ui-with-admin category) ───
            {{- include "suse-library.legacy.envForUiWithAdmin" (dict "chart" "grafana" "release" (include "suse-library.name" .)) | nindent 12 }}
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- /*
                DSL binding mounts (Phase 1). Each services[] entry that
                isn't `provisioning: external` mounts its binding-secret at
                /bindings/<binding>/, so apps following the Service Binding
                Spec convention find their credentials there. external
                services have no Secret to mount (the dev wired the
                connection details elsewhere).
            */}}
            {{- range $i, $svc := $enabled }}
            {{- $prov := $svc.provisioning | default "local" }}
            {{- if ne $prov "external" }}
            - {name: {{ printf "binding-%s" $svc.binding }}, mountPath: {{ printf "/bindings/%s" $svc.binding }}, readOnly: true}
            {{- end }}
            {{- end }}
            {{- /* Legacy mounts gated on not services (same rule as env block above). */}}
            {{- if not .Values.services }}
            {{- if .Values.postgresql.enabled }}
            {{- include "suse-library.legacy.bindingMount" (dict "chart" "postgresql") | nindent 12 }}
            {{- end }}
            {{- if .Values.prometheus.enabled }}
            {{- include "suse-library.legacy.bindingMount" (dict "chart" "prometheus") | nindent 12 }}
            {{- end }}
            {{- if .Values.grafana.enabled }}
            {{- include "suse-library.legacy.bindingMount" (dict "chart" "grafana") | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- /*
            Probes are conditionally rendered. Setting probes.liveness or
            probes.readiness to null in values.yaml skips the corresponding
            probe field on the container — needed for worker / batch shapes
            that don't expose HTTP /health or /ready endpoints. Web shapes
            keep both populated by default. Bundle 0.11.16+.
          */}}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            httpGet: {path: {{ .path }}, port: http}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- /*
            DSL binding volumes — one Secret-backed volume per non-external
            services[] entry. Pairs with the volumeMounts loop above.
        */}}
        {{- range $i, $svc := $enabled }}
        {{- $prov := $svc.provisioning | default "local" }}
        {{- if ne $prov "external" }}
        - name: {{ printf "binding-%s" $svc.binding }}
          secret: {secretName: {{ printf "%s-%s-binding" (include "suse-library.name" $) $svc.binding }}}
        {{- end }}
        {{- end }}
        {{- /* Legacy volumes gated on not services (same rule as env / mounts above). */}}
        {{- if not .Values.services }}
        {{- if .Values.postgresql.enabled }}
        {{- include "suse-library.legacy.bindingVolume" (dict "chart" "postgresql" "release" (include "suse-library.name" .)) | nindent 8 }}
        {{- end }}
        {{- if .Values.prometheus.enabled }}
        {{- include "suse-library.legacy.bindingVolume" (dict "chart" "prometheus" "release" (include "suse-library.name" .)) | nindent 8 }}
        {{- end }}
        {{- if .Values.grafana.enabled }}
        {{- include "suse-library.legacy.bindingVolume" (dict "chart" "grafana" "release" (include "suse-library.name" .)) | nindent 8 }}
        {{- end }}
        {{- end }}
