{{- /*
  deployment.yaml — Multi-workload renderer (Design Orientation 0005).

  Iterates .Values.workloads_resolved[]. Each entry produces one K8s
  resource whose kind depends on workload.kind:
    Deployment (default) | CronJob | DaemonSet

  Naming: <release>-<workload.name>
  Env:    workload.env_resolved (per-workload, resolved by rda render)
  Probes: workload.probes (null = skip)
  Binding volumes stay chart-level (from services[], shared across workloads).
  Per-workload volumes/volumeMounts are additive.
*/ -}}
{{- $enabled := include "suse-library.dsl.enabledServices" $ | fromJsonArray -}}
{{- range $wl := .Values.workloads_resolved | default list }}
{{- $wlName := printf "%s-%s" (include "suse-library.name" $) $wl.name }}
{{- $kind := $wl.kind | default "Deployment" }}
---
{{- if eq $kind "CronJob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $wlName }}
  labels:
    {{- include "suse-library.labels" $ | nindent 4 }}
    rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
spec:
  schedule: {{ $wl.schedule | quote }}
  jobTemplate:
    metadata:
      labels:
        {{- include "suse-library.labels" $ | nindent 8 }}
        rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
    spec:
      template:
        metadata:
          labels:
            {{- include "suse-library.selectorLabels" $ | nindent 12 }}
            rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
          annotations:
            checksum/services: {{ $.Values.services | toJson | sha256sum }}
            {{- with $wl.metrics }}
            {{- if .enabled }}
            prometheus.io/scrape: "true"
            prometheus.io/path: {{ .path | quote }}
            prometheus.io/port: {{ .port | default $wl.port | quote }}
            {{- end }}
            {{- end }}
            {{- with $.Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: {{ $wl.restartPolicy | default "OnFailure" }}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $wl.initContainers }}
          initContainers:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $wl.name }}
              image: "{{ $wl.image.repository }}:{{ $wl.image.tag }}"
              imagePullPolicy: {{ $wl.image.pullPolicy | default "IfNotPresent" }}
              {{- if $wl.port }}
              ports:
                - {name: http, containerPort: {{ $wl.port }}}
              {{- end }}
              env:
                - {name: SERVICE_BINDING_ROOT, value: /bindings}
                {{- if $wl.port }}
                - {name: PORT, value: "{{ $wl.port }}"}
                {{- end }}
                {{- range $entry := $wl.env_resolved | default list }}
                - name: {{ index $entry "name" }}
                  {{- if eq (index $entry "kind") "secret" }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ index $entry "secretRef" }}
                      key: {{ index $entry "secretKey" }}
                  {{- else }}
                  value: {{ index $entry "value" | quote }}
                  {{- end }}
                {{- end }}
              volumeMounts:
                {{- range $i, $svc := $enabled }}
                {{- $prov := $svc.provisioning | default "deploy" }}
                {{- $ep := $svc.credentials | default dict }}
                {{- $secretRef := index $ep "secretRef" | default "" }}
                {{- if or (and (ne $prov "connect") (ne $prov "external")) (ne $secretRef "") }}
                - {name: {{ printf "binding-%s" $svc.binding }}, mountPath: {{ printf "/bindings/%s" $svc.binding }}, readOnly: true}
                {{- end }}
                {{- end }}
                {{- with $wl.volumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with $wl.probes }}
              {{- with .liveness }}
              livenessProbe:
                httpGet: {path: {{ .path }}, port: http}
                initialDelaySeconds: {{ .initialDelaySeconds }}
                periodSeconds: {{ .periodSeconds }}
              {{- end }}
              {{- with .readiness }}
              readinessProbe:
                httpGet: {path: {{ .path }}, port: http}
                initialDelaySeconds: {{ .initialDelaySeconds }}
                periodSeconds: {{ .periodSeconds }}
              {{- end }}
              {{- end }}
              {{- with $wl.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources: {{ toYaml ($wl.resources | default dict) | nindent 16 }}
            {{- range $sc := $wl.sidecars | default list }}
            - name: {{ $sc.name }}
              image: {{ $sc.image }}
              {{- with $sc.resources }}
              resources: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with $sc.env }}
              env: {{ toYaml . | nindent 16 }}
              {{- end }}
              {{- with $sc.volumeMounts }}
              volumeMounts: {{ toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
          volumes:
            {{- range $i, $svc := $enabled }}
            {{- $prov := $svc.provisioning | default "deploy" }}
            {{- $ep := $svc.credentials | default dict }}
            {{- $secretRef := index $ep "secretRef" | default "" }}
            {{- if and (ne $prov "connect") (ne $prov "external") }}
            - name: {{ printf "binding-%s" $svc.binding }}
              secret: {secretName: {{ printf "%s-%s-binding" (include "suse-library.name" $) $svc.binding }}}
            {{- else if ne $secretRef "" }}
            - name: {{ printf "binding-%s" $svc.binding }}
              secret: {secretName: {{ $secretRef }}}
            {{- end }}
            {{- end }}
            {{- with $wl.volumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- else if eq $kind "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $wlName }}
  labels:
    {{- include "suse-library.labels" $ | nindent 4 }}
    rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
spec:
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" $ | nindent 6 }}
      rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" $ | nindent 8 }}
        rda.suse.com/workload: {{ include "suse-library.labelValue" $wl.name | quote }}
      annotations:
        checksum/services: {{ $.Values.services | toJson | sha256sum }}
        {{- with $wl.metrics }}
        {{- if .enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .path | quote }}
        prometheus.io/port: {{ .port | default $wl.port | quote }}
        {{- end }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
