# DSL → chart-values mapping (data-driven library helpers).
#
# Maintenance guide: https://github.com/idefxH/rda-docs/blob/main/reference/dsl-mappings-guide.md
#
# This file is the authoritative source for "how does a unified DSL services[]
# entry of type X translate into the AppCo chart X's values.yaml shape, and
# what binding-secret keys come out". The library's _helpers.tpl reads it
# at template time via `tpl . | fromYaml`; no Go-templated if/else if arms
# per chart anymore.
#
# Versioned per chart: a chart's values structure typically changes between
# major versions (e.g. redis 7→8 reshuffles `master.*` paths). For each
# chart we list versions[] in order; the first entry whose `constraint`
# matches the actually-vendored chart version wins. The version is read
# from .Chart.Dependencies at render time.
#
# When a chart's value structure breaks: add a new versions[] entry at the
# top with the new constraint. Old entries stay for projects still on the
# previous major.
#
# Format: apiVersion: rda.suse.com/dsl-mapping/v1alpha1
#
# Per-version block:
#   constraint: <semver constraint> (Masterminds/semver — same as Helm)
#   service:
#     host: <Go template>      # rendered with {Release: .Release.Name}
#     port: <int>
#   values_mapping:            # DSL path → chart values path
#     <dsl-path>: <values-path>
#   auth_seed_paths:           # OPTIONAL list of DSL paths whose values are
#     - <dsl-path>             # baked into the chart's PVC on first init
#                              # (typically the user/password/database used
#                              # by the chart's init container). Drives the
#                              # rda.suse.com/auth-seed annotation on the
#                              # binding-secret + the validateConsistency
#                              # drift check. Stateful charts (postgres,
#                              # mariadb, mongo, redis-with-persistence)
#                              # declare this; stateless ones (grafana,
#                              # prometheus) leave it absent. See
#                              # idefxH/rda-opinion-bundle-example#63.
#   binding_secret:            # ordered list, projects to <release>-<binding>-binding
#     - key: <name>
#       <one of: literal | template | from_dsl>
#       required: <bool>       # default false; only meaningful for from_dsl
#       default: <string>      # only meaningful for from_dsl
#       skip_env: <bool>       # default false; when true, the key is in the
#                              # Secret's stringData but envFromBinding does
#                              # not project it as <BINDING>_<KEY> (used for
#                              # metadata keys like type / provider that the
#                              # app shouldn't see as env vars)
#       env_aliases:           # OPTIONAL list of strings; emits additional
#         - <name>             # env vars referencing the same Secret key,
#                              # e.g. ['user'] on the username key projects
#                              # both DB_USERNAME (canonical) and DB_USER
#                              # (env-var convention).
#
# concepts/catalog.md in rda-docs should stay aligned with this file. The
# `tests/dsl-mappings-targets-valid/` test guard catches structural drift;
# catalog/doc drift is caught at PR review.

apiVersion: rda.suse.com/dsl-mapping/v1alpha1

# Upstream compatibility (source: docs.apps.rancher.io):
#
#   MADE FROM SCRATCH by SUSE (own podTemplates schema, no upstream equivalent):
#     postgresql, redis, valkey, mariadb, apache-kafka, etcd
#     These use the AppCo podTemplates.containers.<name>.resources pattern.
#     No upstream chart has the same values schema.
#
#   BASED ON UPSTREAM (same values schema, SUSE images swapped in):
#     prometheus  — prometheus-community/prometheus
#     grafana     — grafana/grafana
#     dex         — dexidp/dex
#     minio       — minio community chart
#     vault       — hashicorp/vault
#     opensearch  — opensearch-project/opensearch
#     influxdb    — influxdata/influxdb2
#     harbor      — goharbor/harbor
#     apache-airflow — apache/airflow
#     nats        — nats-io/nats (minor diff: container.merge.resources vs container.resources)

charts:
  postgresql:
    # MADE FROM SCRATCH by SUSE (docs.apps.rancher.io/reference-guides/postgresql)
    # No upstream chart equivalent — Bitnami uses primary.resources (incompatible)
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/postgresql
        requires_pull_secret: true
      community:
        chart_ref: oci://registry-1.docker.io/bitnamicharts/postgresql
    default_branch: "17"
    branches:
      "18": {chart_version: "0.5.5-7.1"}
      "17": {chart_version: "0.4.4-29.1"}
      "16": {chart_version: "0.2.1-7.1"}
    versions:
      - constraint: ">=0.1.0 <1.0.0"
        source: appco
        # AppCo postgresql 0.4.x.
        # Service is named <release>-postgresql (no -primary / -master suffix).
        service:
          host: "{{ .Release.Name }}-postgresql.{{ .Release.Namespace }}.svc.cluster.local"
          port: 5432
        values_mapping:
          auth.user.name: postgresql.auth.username
          auth.user.password: postgresql.auth.password
          auth.user.database: postgresql.auth.database
          auth.admin.password: postgresql.auth.postgresPassword
          persistence.enabled: postgresql.persistence.enabled
          persistence.size: postgresql.persistence.resources.requests.storage
          metrics.enabled: postgresql.metrics.enabled
          resources.requests.cpu: postgresql.podTemplates.containers.postgresql.resources.requests.cpu
          resources.requests.memory: postgresql.podTemplates.containers.postgresql.resources.requests.memory
          resources.limits.cpu: postgresql.podTemplates.containers.postgresql.resources.limits.cpu
          resources.limits.memory: postgresql.podTemplates.containers.postgresql.resources.limits.memory
        # AppCo postgres init only runs once on empty PGDATA. Once these
        # values are baked into the volume, subsequent re-deploys keep the
        # ORIGINAL credentials/database — env-var changes are silently
        # ignored. Listing these paths drives the auth-seed annotation +
        # the template-time drift check that fails loud with the nuke
        # recipe when the dev edits one of them after first deploy.
        auth_seed_paths:
          - auth.user.name
          - auth.user.password
          - auth.user.database
          - auth.admin.password
        binding_secret:
          - {key: type, literal: postgresql, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-postgresql"}
          - {key: port, literal: "5432"}
          # username/database stay SBS-canonical in the Secret. The
          # env_aliases also project under <BINDING>_USER /
          # <BINDING>_NAME — the spellings libpq, JDBC, the `pg` npm
          # package, sequelize, prisma, and most SQL clients expect.
          - {key: username, from_dsl: auth.user.name, default: app, env_aliases: [user]}
          - {key: password, from_dsl: auth.user.password, required: true}
          - {key: database, from_dsl: auth.user.database, required: true, env_aliases: [name]}
          # connection_url and jdbc_url are composed from the resolved
          # binding fields in the render engine (collectBindings) and in
          # the Helm template (_helpers.tpl). No binding_secret entry
          # needed — both paths compose from host/port/user/pass/db.

        scaffold:
          # Common (auth + persistence + metrics + resources) — appears in
          # multiple charts (mariadb, redis), auto-classified as such by
          # the scaffold formatter via IsCommonField cardinality.
          auth.admin.password:
            default: ""
            comment: "admin (postgres user) password — required"
          auth.user.name:
            default: "app"
            comment: "application user — your service connects as this"
          auth.user.password:
            default: ""
            comment: "application user password — required"
          auth.user.database:
            default: ""
            comment: "application database — required"
          # Persistence-off scaffold default (issue #60). Dev flips to true
          # once they have data worth keeping; the size pre-set means the
          # flip is a one-line change. Auth-seed annotation (bundle #63)
          # guards drift when persistence is on.
          persistence.enabled:
            default: false
          persistence.size:
            default: "1Gi"
          metrics.enabled:
            default: true
          resources.requests.cpu:
            default: "100m"
          resources.requests.memory:
            default: "256Mi"
          resources.limits.cpu:
            default: "500m"
          resources.limits.memory:
            default: "1Gi"

      - constraint: ">=16.0.0 <17.0.0"
        source: community
        # Bitnami postgresql 16.x. Same DSL surface as AppCo; only the
        # resources paths differ (primary.resources vs podTemplates).
        service:
          host: "{{ .Release.Name }}-postgresql.{{ .Release.Namespace }}.svc.cluster.local"
          port: 5432
        values_mapping:
          auth.user.name: postgresql.auth.username
          auth.user.password: postgresql.auth.password
          auth.user.database: postgresql.auth.database
          auth.admin.password: postgresql.auth.postgresPassword
          persistence.enabled: postgresql.persistence.enabled
          persistence.size: postgresql.persistence.resources.requests.storage
          metrics.enabled: postgresql.metrics.enabled
          resources.requests.cpu: postgresql.primary.resources.requests.cpu
          resources.requests.memory: postgresql.primary.resources.requests.memory
          resources.limits.cpu: postgresql.primary.resources.limits.cpu
          resources.limits.memory: postgresql.primary.resources.limits.memory
        auth_seed_paths:
          - auth.user.name
          - auth.user.password
          - auth.user.database
          - auth.admin.password
        binding_secret:
          - {key: type, literal: postgresql, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-postgresql"}
          - {key: port, literal: "5432"}
          - {key: username, from_dsl: auth.user.name, default: app, env_aliases: [user]}
          - {key: password, from_dsl: auth.user.password, required: true}
          - {key: database, from_dsl: auth.user.database, required: true, env_aliases: [name]}

        scaffold:
          auth.admin.password:
            default: ""
            comment: "admin (postgres user) password — required"
          auth.user.name:
            default: "app"
            comment: "application user — your service connects as this"
          auth.user.password:
            default: ""
            comment: "application user password — required"
          auth.user.database:
            default: ""
            comment: "application database — required"
          persistence.enabled:
            default: false
          persistence.size:
            default: "1Gi"
          metrics.enabled:
            default: true
          resources.requests.cpu:
            default: "100m"
          resources.requests.memory:
            default: "256Mi"
          resources.limits.cpu:
            default: "500m"
          resources.limits.memory:
            default: "1Gi"

  redis:
    # MADE FROM SCRATCH by SUSE (docs.apps.rancher.io/reference-guides/redis)
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/redis
        requires_pull_secret: true
      community:
        chart_ref: oci://registry-1.docker.io/bitnamicharts/redis
    versions:
      - constraint: ">=2.0.0 <3.0.0"
        source: appco
        # AppCo redis 2.x (chart packaging — redis binary 8.x lineage).
        # Note: the constraint uses the AppCo helm chart version, not
        #
        # AppCo redis defaults to architecture=standalone (single
        # replica), so the Service is just <release>-redis (no -master suffix). Persistence and
        # metrics keys are top-level under redis.* (no master.* prefix).
        # Container resources are nested under
        # podTemplates.containers.redis.resources because AppCo's
        # PodTemplate-based schema separates init / app / sidecar
        # resource budgets.
        service:
          host: "{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local"
          port: 6379
        values_mapping:
          auth.user.password: redis.auth.user.password
          persistence.enabled: redis.persistence.enabled
          persistence.size: redis.persistence.resources.requests.storage
          metrics.enabled: redis.metrics.enabled
          resources.requests.cpu: redis.podTemplates.containers.redis.resources.requests.cpu
          resources.requests.memory: redis.podTemplates.containers.redis.resources.requests.memory
          resources.limits.cpu: redis.podTemplates.containers.redis.resources.limits.cpu
          resources.limits.memory: redis.podTemplates.containers.redis.resources.limits.memory
        # Redis password lives in the AOF / RDB snapshot once persistence
        # is on — flipping it after first init requires a PVC reset.
        # When persistence is off (default for redis), the auth seed
        # check still fires but is informational: the lookup finds no
        # PVC, the helper short-circuits with no warning.
        auth_seed_paths:
          - auth.user.password
        binding_secret:
          - {key: type, literal: redis, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-redis"}
          - {key: port, literal: "6379"}
          - {key: password, from_dsl: auth.user.password, required: true}

        scaffold:
          auth.user.password:
            default: ""
            comment: "redis password — required"
          # Persistence-off default — flip to true for durable AOF/RDB
          # snapshots (auth-seed annotation guards drift when on).
          persistence.enabled:
            default: false
          metrics.enabled:
            default: true
          resources.requests.cpu:
            default: "50m"
          resources.requests.memory:
            default: "128Mi"
          resources.limits.cpu:
            default: "200m"
          resources.limits.memory:
            default: "256Mi"

      - constraint: ">=20.0.0 <21.0.0"
        source: community
        # Bitnami redis 20.x. Same DSL surface as AppCo; only the
        # resources paths differ (master.resources vs podTemplates).
        service:
          host: "{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local"
          port: 6379
        values_mapping:
          auth.user.password: redis.auth.user.password
          persistence.enabled: redis.persistence.enabled
          persistence.size: redis.persistence.resources.requests.storage
          metrics.enabled: redis.metrics.enabled
          resources.requests.cpu: redis.master.resources.requests.cpu
          resources.requests.memory: redis.master.resources.requests.memory
          resources.limits.cpu: redis.master.resources.limits.cpu
          resources.limits.memory: redis.master.resources.limits.memory
        auth_seed_paths:
          - auth.user.password
        binding_secret:
          - {key: type, literal: redis, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-redis"}
          - {key: port, literal: "6379"}
          - {key: password, from_dsl: auth.user.password, required: true}

        scaffold:
          auth.user.password:
            default: ""
            comment: "redis password — required"
          persistence.enabled:
            default: false
          metrics.enabled:
            default: true
          resources.requests.cpu:
            default: "50m"
          resources.requests.memory:
            default: "128Mi"
          resources.limits.cpu:
            default: "200m"
          resources.limits.memory:
            default: "256Mi"

  prometheus:
    # BASED ON upstream: prometheus-community/prometheus
    # upstream_repo: https://prometheus-community.github.io/helm-charts
    # DROP-IN: same values schema
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/prometheus
        requires_pull_secret: true
      community:
        chart_ref: https://prometheus-community.github.io/helm-charts
    versions:
      - constraint: ">=29.0.0"
        # AppCo prometheus 29.x (community chart 29.x lineage, prometheus
        # binary 3.11.x). Service is named <release>-prometheus-server
        # (`-server` suffix because the chart deploys server +
        # alertmanager + node-exporter + pushgateway + kube-state-metrics
        # as separate workloads). Port 80 → pod port 9090 (HTTP UI +
        # /metrics + /api/v1/query). UI auto-Ingress (issue #8) uses
        # port 80.
        #
        # No auth: Prometheus is unauthenticated by default — ingress
        # protection (BasicAuth, OIDC) is the standard way to secure
        # the UI in shared clusters. No auth_seed_paths since there's
        # no PVC-baked credential to drift against; the time-series
        # database is data, not auth state.
        datasource_type: prometheus
        service:
          host: "{{ .Release.Name }}-prometheus-server.{{ .Release.Namespace }}.svc.cluster.local"
          port: 80
          scheme: http
        values_mapping:
          # Persistence for the TSDB (time-series database).
          persistence.enabled: prometheus.server.persistentVolume.enabled
          persistence.size: prometheus.server.persistentVolume.size
          # Retention (how long to keep metrics — e.g. "15d", "30d").
          # Prometheus-specific DSL field; the chart's default applies
          # when unset.
          retention: prometheus.server.retention
          # UI Ingress.
          ingress.enabled: prometheus.server.ingress.enabled
          # Plural `hosts: [...]` is canonical (matches the app-level DSL
          # at suse-library.ingress.hosts). Singular `host: <str>` stays
          # supported for back-compat with bundles ≤0.11.7 — projected to
          # hosts[0] via the bracket-notation projection (closes
          # rda-cli#75). Both writeable; if a project sets BOTH, the
          # render's seen-types collision detection will warn loud.
          ingress.host: prometheus.server.ingress.hosts[0]
          ingress.hosts: prometheus.server.ingress.hosts
          # Resources are server-scoped (the other prometheus chart
          # components — alertmanager, exporters, pushgateway — are
          # disabled by default in the library's values.yaml).
          resources.requests.cpu: prometheus.server.resources.requests.cpu
          resources.requests.memory: prometheus.server.resources.requests.memory
          resources.limits.cpu: prometheus.server.resources.limits.cpu
          resources.limits.memory: prometheus.server.resources.limits.memory
        binding_secret:
          - {key: type, literal: prometheus, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-prometheus-server"}
          - {key: port, literal: "80"}
          # url is the canonical "where do I scrape / query" — apps that
          # use Prometheus as a data source (Grafana, custom dashboards,
          # OpenTelemetry pipelines) typically read this single field.
          - {key: url, template: "http://{{ .Release.Name }}-prometheus-server:80"}

        scaffold:
          # No `auth` block — Prometheus is unauthenticated by default;
          # auth belongs at the ingress layer (BasicAuth, OIDC).
          persistence.enabled:
            default: false
          persistence.size:
            default: "8Gi"
          retention:
            default: "15d"
            comment: "TSDB retention — e.g. 15d, 30d, 1y"
          ingress.enabled:
            default: false
          # Working <binding>.<release>.localtest.me default — no /etc/hosts
          # edits needed; localtest.me wildcards resolve to 127.0.0.1.
          ingress.hosts:
            default:
              - "{{.Binding}}.{{.domain}}"
            comment: "uses {{.domain}} from suse-library.domain"
          resources.requests.cpu:
            default: "100m"
          resources.requests.memory:
            default: "256Mi"
          resources.limits.cpu:
            default: "500m"
          resources.limits.memory:
            default: "1Gi"

  grafana:
    # BASED ON upstream: grafana/grafana
    # upstream_repo: https://grafana.github.io/helm-charts
    # DROP-IN: same values schema
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/grafana
        requires_pull_secret: true
      community:
        chart_ref: https://grafana.github.io/helm-charts
    versions:
      - constraint: ">=12.0.0"
        # AppCo grafana 12.x. Service maps port 80 (chart default) to pod
        # port 3000. The library's auto-Ingress (issue #8) uses port 80.
        datasources_target: grafana.datasources
        service:
          host: "{{ .Release.Name }}-grafana.{{ .Release.Namespace }}.svc.cluster.local"
          port: 80
        values_mapping:
          auth.admin.name: grafana.adminUser
          auth.admin.password: grafana.adminPassword
          ingress.enabled: grafana.ingress.enabled
          # Plural `hosts: [...]` is canonical (matches the app-level DSL
          # at suse-library.ingress.hosts). Singular `host: <str>` stays
          # supported for back-compat — projected to hosts[0] via
          # bracket-notation (closes rda-cli#75). Both writeable.
          ingress.host: grafana.ingress.hosts[0]
          ingress.hosts: grafana.ingress.hosts
          metrics.enabled: grafana.grafana.ini.metrics.enabled
          persistence.enabled: grafana.persistence.enabled
          persistence.size: grafana.persistence.size
          resources.requests.cpu: grafana.resources.requests.cpu
          resources.requests.memory: grafana.resources.requests.memory
          resources.limits.cpu: grafana.resources.limits.cpu
          resources.limits.memory: grafana.resources.limits.memory
        binding_secret:
          - {key: type, literal: grafana, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-grafana"}
          - {key: port, literal: "80"}
          - {key: url, template: "http://{{ .Release.Name }}-grafana:80"}
          - {key: adminUser, from_dsl: auth.admin.name, default: admin}
          - {key: adminPassword, from_dsl: auth.admin.password, required: true}

        dependencies:
          - charts: [dex]
            required: false
            dsl_field: auth_provider
            wire_type: oidc
            wiring:
              grafana.grafana.ini.auth.generic_oauth.enabled: "__literal:true"
              grafana.grafana.ini.auth.generic_oauth.name: "__literal:Dex"
              grafana.grafana.ini.auth.generic_oauth.client_id: "__bootstrap:auth.clients.id__"
              grafana.grafana.ini.auth.generic_oauth.client_secret: "__bootstrap:auth.clients.secret__"
              grafana.grafana.ini.auth.generic_oauth.scopes: "__literal:openid profile email"
              grafana.grafana.ini.auth.generic_oauth.auth_url: "__binding:public_url__/auth"
              grafana.grafana.ini.auth.generic_oauth.token_url: "__url__/token"
              grafana.grafana.ini.auth.generic_oauth.api_url: "__url__/userinfo"

        scaffold:
          auth_provider:
            default: ""
            comment: "optional — binding name of a dex service for OIDC login"
          auth.admin.name:
            default: "admin"
          auth.admin.password:
            default: ""
            comment: "grafana admin password — required"
          ingress.enabled:
            default: false
          ingress.hosts:
            default:
              - "{{.Binding}}.{{.domain}}"
            comment: "uses {{.domain}} from suse-library.domain"
          metrics.enabled:
            default: false
          resources.requests.cpu:
            default: "50m"
          resources.requests.memory:
            default: "256Mi"
          resources.limits.cpu:
            default: "200m"
          resources.limits.memory:
            default: "512Mi"

  dex:
    # BASED ON upstream: dexidp/dex
    # upstream_repo: https://charts.dexidp.io
    # DROP-IN: same values schema
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/dex
        requires_pull_secret: true
      community:
        chart_ref: https://charts.dexidp.io
    versions:
      - constraint: ">=0.24.0 <1.0.0"
        # Dex 0.24.0 (app 2.44.0) via SUSE Application Collection.
        # Chart name on disk is `dex-idp` (AppCo's slug) but library
        # Chart.yaml declares it with `alias: dex` so resource names,
        # values keys, and helper Chart.Name all use "dex". User-
        # facing API is unchanged from the upstream chart we pulled
        # from charts.dexidp.io pre-0.11.25.
        #
        # Service: <release>-dex on port 5556 (HTTP issuer endpoint).
        # gRPC (5557) and HTTPS (5554) are off by default; flip via
        # passthrough.grpc.enabled / passthrough.https.enabled when
        # the project needs them.
        #
        # Bootstrap: dex requires `config:` to be set, otherwise the pod
        # crashloops at startup. The DSL exposes only the high-level
        # knobs (issuer URL, ingress, metrics, resources) — anything
        # else (connectors, oauth2 clients, staticPasswords, the
        # storage block) goes through `passthrough.config.*`. The
        # `rda service add dex` scaffold writes a sane bootstrap
        # config (storage.memory + enablePasswordDB) so a fresh
        # project starts with a working dex even before the dev edits
        # the connector list.
        service:
          host: "{{ .Release.Name }}-dex.{{ .Release.Namespace }}.svc.cluster.local"
          ports:
            # http is the OIDC issuer endpoint — discovery, /token,
            # /authorize, /keys all live here. Apps' OIDC libraries
            # read DEX_HOST / DEX_PORT / DEX_URL.
            http: { port: 5556, scheme: http, primary: true }
            # gRPC API — for dex-managing clients (CLI, admin tools).
            # Off by default in the chart; flip via passthrough.grpc.
            # Cross-binding refs see DEX_GRPC_PORT / DEX_GRPC_URL.
            grpc: { port: 5557, scheme: tcp }
        values_mapping:
          # Issuer URL is NOT in values_mapping — it's auto-derived via
          # `derived_values:` below from `services[].ingress.host` (when
          # ingress is enabled) or the in-cluster Service URL otherwise.
          # The user just sets `ingress.host`; the issuer always matches
          # what the browser hits. To override (e.g. external SSO), set
          # `services[].issuer:` explicitly — `skip_if` honors it.
          # Ingress: same DSL shape as grafana/prometheus (singular
          # `ingress.host` + plural `ingress.hosts: [str]`), but the
          # dex chart's ingress.yaml expects a richer object form
          # `[{host, paths: [{path, pathType}]}]`. The projector
          # fills in the missing `paths` field via `chart_defaults`
          # below — devs writing the simple string list in their
          # values.yaml get a working Ingress without knowing the
          # chart-side shape difference.
          ingress.enabled: dex.ingress.enabled
          ingress.host: dex.ingress.hosts[0].host
          # Dex exposes /metrics natively — no enable flag needed.
          # ServiceMonitor (Prometheus Operator CRD) is opt-in via
          # passthrough only: passthrough.serviceMonitor.enabled: true
          # The DSL metrics.enabled is intentionally unmapped for dex
          # to avoid creating a CRD that doesn't exist on standalone
          # Prometheus clusters.
          # Resources — the dex chart shape is a flat resources block.
          resources.requests.cpu: dex.resources.requests.cpu
          resources.requests.memory: dex.resources.requests.memory
          resources.limits.cpu: dex.resources.limits.cpu
          resources.limits.memory: dex.resources.limits.memory
        # OIDC issuer auto-derivation (rda-cli 0.1.55+'s derived_values).
        # The issuer claim in dex's tokens MUST match the URL the browser
        # hits — Ingress URL when ingress is enabled, in-cluster Service
        # URL otherwise. Auto-deriving from a SINGLE source of truth
        # (`services[].ingress.host`) eliminates the entire class of
        # "issuer says :5556 but browser uses :80" mismatches that
        # produce "iss claim verify failed → 401" at runtime.
        #
        # `skip_if: issuer` respects an explicit user override on
        # `services[].issuer:` for cases where the dex instance fronts
        # an external SSO chain or sits behind a TLS-terminating proxy
        # the bundle doesn't model.
        derived_values:
          - target: dex.config.issuer
            skip_if: issuer
            template: |
              {{- if .Service.ingress.enabled -}}
              http://{{ index .Service.ingress "host" }}
              {{- else -}}
              http://{{ .Release.Name }}-dex:5556
              {{- end -}}
        # Cross-binding refs (rda-cli 0.1.55+, MILESTONE 0.11.29).
        # Surfaces dex's computed URLs as `${binding:NAME.<field>}`
        # references workloads can use in their `suse-library.env:`
        # block. Same template as derived_values above (the chart's
        # internal config.issuer); exposing the same value as a
        # binding field lets `AUTH_ISSUER: ${binding:auth.issuer}`
        # resolve to the URL the chart's discovery endpoint actually
        # returns. `public_url` is the same value (dex's issuer ==
        # public URL by design); both are exposed for app-side
        # symmetry with the AUTH_PUBLIC_URL convention used by the
        # web-go / web-nodejs templates' OIDC code.
        binding_fields:
          issuer:
            template: |
              {{- if .Service.ingress.enabled -}}
              http://{{ index .Service.ingress "host" }}
              {{- else -}}
              http://{{ .Release.Name }}-dex:5556
              {{- end -}}
          public_url:
            template: |
              {{- if .Service.ingress.enabled -}}
              http://{{ index .Service.ingress "host" }}
              {{- else -}}
              http://{{ .Release.Name }}-dex:5556
              {{- end -}}
        # Chart-required fields the DSL doesn't surface (because they
        # don't vary across deployments). `rda render` writes these
        # AFTER applying values_mapping, only when at least one
        # values_mapping target landed in the overlay (i.e. the chart
        # is actively configured). Each entry: `<target_path>:
        # <literal_value>`. Same path syntax as values_mapping
        # (bracket notation supported). NS Phase G (rda-cli 0.1.49).
        chart_defaults:
          # Dex requires each ingress host entry to have a `paths`
          # array. We default to a single root-path
          # ImplementationSpecific entry — the standard Ingress shape
          # for "match everything under /". Devs needing more
          # specific routing override via passthrough.
          dex.ingress.hosts[0].paths:
            - path: "/"
              pathType: ImplementationSpecific
        # No auth_seed_paths: dex's storage backend is configurable
        # (memory / kubernetes / postgres) — only the persistent backends
        # carry seed-class state. When the dev opts into postgres-backed
        # dex via passthrough.config.storage.type=postgres, that's a
        # cross-binding concern (a postgres binding feeding dex), out of
        # scope for the dex catalog entry's auth-seed declaration.
        binding_secret:
          # Identity / type info — present on all bindings; skip_env
          # keeps these out of the projected env-var list (we only
          # want the connectivity bits as <BINDING>_* env vars).
          - {key: type, literal: dex, skip_env: true}
          - {key: provider, literal: dexidp-upstream, skip_env: true}

          # ─── Connectivity (in-cluster) ─────────────────────────
          # Stable in-cluster Service URL. Always set, regardless of
          # whether ingress is enabled. Apps' Kubernetes-side OIDC
          # libraries (token verifiers, JWKS fetch) hit this. App pod
          # env: <BINDING>_HOST, <BINDING>_PORT, <BINDING>_URL.
          - {key: host, template: "{{ .Release.Name }}-dex"}
          - {key: port, literal: "5556"}
          - {key: url, template: "http://{{ .Release.Name }}-dex:5556"}

          # ─── OIDC issuer (auto-derives from ingress.host) ──────
          # This MUST equal whatever URL the *browser* hits. When
          # ingress is enabled, that's the ingress URL; when not,
          # it's the in-cluster Service URL (which the browser then
          # only reaches through tilt port-forward or in-cluster
          # workloads that aren't human-driven).
          #
          # `derived_values:` above writes .Values.dex.config.issuer
          # on render. We just read it back here. App pod env:
          # <BINDING>_ISSUER. Token verifiers compare token's
          # `iss` claim against this — auto-derivation eliminates the
          # mismatch class of bugs.
          - key: issuer
            template: |
              {{- if and .Values.dex .Values.dex.config .Values.dex.config.issuer -}}
              {{ .Values.dex.config.issuer }}
              {{- else -}}
              http://{{ .Release.Name }}-dex:5556
              {{- end -}}

          # ─── Public URL (browser-facing) ───────────────────────
          # Same value as `issuer` today (auto-derived from ingress).
          # Kept as a separate key so apps can branch their UX:
          #   - <BINDING>_PUBLIC_URL — where to redirect the browser
          #   - <BINDING>_ISSUER     — what the verifier expects in iss
          # If a future config splits them (e.g. dex behind a TLS-
          # terminating proxy with a /dex path mount, or external SSO
          # passthrough), the binding contract stays stable.
          - key: public_url
            template: |
              {{- if and .Values.dex .Values.dex.config .Values.dex.config.issuer -}}
              {{ .Values.dex.config.issuer }}
              {{- else -}}
              http://{{ .Release.Name }}-dex:5556
              {{- end -}}

          # ─── OIDC client trio (browser-side credentials) ───────
          # Read from the FIRST entry of dex.config.staticClients
          # post-render. The bundle scaffold pre-fills one client
          # (id=<project>-client, secret=dev-secret, redirectURIs=
          # http://<project>.localtest.me/auth/callback) so a fresh
          # `rda new + rda service add dex auth + tilt up` boots a
          # working OIDC chain without manual edits. App pod env:
          # <BINDING>_CLIENT_ID / _CLIENT_SECRET / _REDIRECT_URI.
          # When the dev wants multiple clients (e.g. SPA + admin
          # CLI), they edit `bootstrap.auth.clients[]` and the
          # binding-secret keys still point at staticClients[0] —
          # the canonical client.
          - key: client_id
            template: |
              {{- if and .Values.dex .Values.dex.config .Values.dex.config.staticClients -}}
              {{- with index .Values.dex.config.staticClients 0 -}}
              {{ .id }}
              {{- end -}}
              {{- end -}}
          - key: client_secret
            template: |
              {{- if and .Values.dex .Values.dex.config .Values.dex.config.staticClients -}}
              {{- with index .Values.dex.config.staticClients 0 -}}
              {{ .secret }}
              {{- end -}}
              {{- end -}}
          - key: redirect_uri
            template: |
              {{- if and .Values.dex .Values.dex.config .Values.dex.config.staticClients -}}
              {{- with index .Values.dex.config.staticClients 0 -}}
              {{- if .redirectURIs -}}
              {{ index .redirectURIs 0 }}
              {{- end -}}
              {{- end -}}
              {{- end -}}

        # DO-0004 Phase 1: optional postgresql dependency for persistent storage.
        # When the dev provides a postgresql binding via the `state_db` field,
        # rda render disables dex's internal memory/sqlite storage and wires
        # the external postgresql connection. Without this field, dex uses
        # in-memory storage (the scaffold default) — fine for dev, not for
        # staging/prod where dex state must survive restarts.
        dependencies:
          - charts: [postgresql]
            required: false
            dsl_field: state_db
            wiring:
              dex.config.storage.type: __literal:postgres
              dex.config.storage.config.host: __host_short__
              dex.config.storage.config.port: __port__
              dex.config.storage.config.user: auth.user.name
              dex.config.storage.config.password: auth.user.password
              dex.config.storage.config.database: auth.user.database
              dex.config.storage.config.ssl.mode: __literal:disable
          - charts: [mariadb]
            required: false
            dsl_field: state_db
            wiring:
              dex.config.storage.type: __literal:mysql
              dex.config.storage.config.host: __host_short__
              dex.config.storage.config.port: __port__
              dex.config.storage.config.user: auth.user.name
              dex.config.storage.config.password: auth.user.password
              dex.config.storage.config.database: auth.user.database

        scaffold:
          # DSL fields (mapped via values_mapping)
          # NOTE: `issuer` is no longer scaffolded — it's auto-derived from
          # `services[].ingress.host` (or in-cluster URL when no ingress)
          # by `derived_values:` above. Devs who need an external SSO
          # issuer override can set `services[].issuer:` manually.
          #
          # Dex needs browser access for OIDC flows, so ingress defaults
          # to true (unlike postgres/redis which are pod-internal).
          # Optional: postgresql binding for persistent storage (DO-0004).
          # When set, rda render wires dex's storage to the referenced
          # postgresql binding. Without it, dex uses in-memory (dev default).
          state_db:
            default: ""
            comment: "optional — binding name of a postgresql or mariadb service for persistent storage"
          ingress.enabled:
            default: true
          ingress.host:
            default: "{{.Binding}}.{{.domain}}"
            comment: "uses {{.domain}} from suse-library.domain"
          resources.requests.cpu:
            default: "50m"
          resources.requests.memory:
            default: "128Mi"
          resources.limits.cpu:
            default: "200m"
          resources.limits.memory:
            default: "256Mi"
          # Chart-side bootstrap (passthrough.* — copied verbatim by render).
          # dex refuses to boot without `config:` set; these defaults give a
          # working dev posture (in-memory storage, password DB on, OAuth
          # approval bypassed).
          passthrough.config.storage.type:
            default: "memory"
            comment: "memory|kubernetes|postgres — flip for prod (kubernetes uses CRDs; postgres needs a separate binding)"
          passthrough.config.enablePasswordDB:
            default: true
          passthrough.config.oauth2.skipApprovalScreen:
            default: true
            comment: "skip OAuth approval screen — flip off for prod"
          passthrough.config.staticClients:
            default: []
          passthrough.config.staticPasswords:
            default: []
          # ─── OIDC password-grant connector ─────────────────────
          # dex's /token endpoint refuses grant_type=password with
          # `unsupported_grant_type` unless `oauth2.passwordConnector`
          # names a connector that supports it (`local` for the
          # built-in passwordDB). Required for any test/script that
          # password-grants programmatically. Browser-cookie OIDC
          # flows work without this; we set it because the cost is
          # zero and password-grant-via-curl is the simplest e2e
          # check.
          passthrough.config.oauth2.passwordConnector:
            default: local
            comment: "connector for password-grant; flip to '' if you only want browser flow"
          # NOTE: `bootstrap.auth.users` and `bootstrap.auth.clients`
          # are NOT pre-filled. The dev declares them explicitly via
          # `rda service bootstrap auth.users add ...` (typed CLI) or by
          # editing `services[binding=auth].bootstrap.*` directly.
          # This avoids burying default credentials (dev/dev) in
          # scaffolded yaml where they easily survive into staging.
          # See concepts/auth.md for the recommended workflow.

        # ─── Capabilities (Phase 2 of DO 0001-A) ───────────────────
        # Bootstrap-data the dex chart accepts: a typed list of users
        # the IdP should know about, and a typed list of OIDC clients
        # apps register with. Devs declare these under
        # `services[].bootstrap.auth.users:` / `bootstrap.auth.clients:`
        # in their values.yaml — the renderer materialises them at
        # `dex.config.staticPasswords` / `dex.config.staticClients`,
        # the same shape this chart's scaffold pre-fills as `[]`.
        #
        # Once a chart declares a capability, the user has two API
        # surfaces for the same data:
        #   1. `services[].passthrough.config.staticPasswords:` (verbatim)
        #   2. `services[].bootstrap.auth.users:`           (typed)
        # Capabilities project AFTER passthrough at render time, so
        # `bootstrap.auth.users` wins when both are set. The
        # passthrough path stays for ad-hoc fields that don't yet have
        # a capability declared (kubernetes-storage tuning, custom
        # connector blocks, etc).
        #
        # The CLI (`rda service bootstrap auth.users add ...` / `rda service bootstrap
        # auth.clients add ...`) edits this same `bootstrap.<cap>` list
        # in values.yaml, with field-validation against the schema below.
        capabilities:
          auth.users:
            backend: file-static
            order: 1
            schema:
              name:     { type: string, required: true }
              password: { type: string, required: true, secret: true }
            projection:
              target:    dex.config.staticPasswords
              transform: bcrypt-password-to-hash
              # User writes `name:`; dex's staticPasswords expects `email:`.
              # The bcrypt transform replaces `password:` with `hash:` (the
              # field dex actually consumes, with $2a$ cost-10 bcrypt).
              field_map:
                name: email
          auth.clients:
            backend: file-static
            order: 2
            wire_offer: oidc
            schema:
              id:           { type: string,        required: true }
              secret:       { type: string,        required: true, secret: true }
              redirectURIs: { type: list,          required: true }
              # `name` is the optional human-readable label dex shows
              # on the consent screen. Apps that never display the
              # consent screen (skipApprovalScreen=true, the bundle
              # default) can omit it.
              name:         { type: string }
            projection:
              target: dex.config.staticClients
            init:
              id: "{{project}}-client"
              name: "{{project}}"
              secret: "{{random:hex:24}}"
              redirectURIs:
                - "http://{{app.ingress.hosts.0}}/auth/callback"
                - "http://localhost:18081/auth/callback"

  mariadb:
    # MADE FROM SCRATCH by SUSE (docs.apps.rancher.io/reference-guides/mariadb)
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/mariadb
        requires_pull_secret: true
      community:
        chart_ref: oci://registry-1.docker.io/bitnamicharts/mariadb
    versions:
      - constraint: ">=0.1.0 <1.0.0"
        source: appco
        # AppCo mariadb 0.1.x (chart from-scratch — see chart README).
        # Service: <release>-mariadb on port 3306. The chart deploys a
        # StatefulSet with 1 replica by default; passthrough.nodeCount
        # scales replicas (the chart has built-in standard replication
        # from primary to replicas).
        #
        # Auth shape mirrors postgresql closely. Container init runs once
        # on empty data dir; auth-seed semantics apply the same way.
        service:
          host: "{{ .Release.Name }}-mariadb.{{ .Release.Namespace }}.svc.cluster.local"
          port: 3306
        values_mapping:
          auth.user.name: mariadb.auth.username
          auth.user.password: mariadb.auth.password
          auth.user.database: mariadb.auth.database
          auth.admin.password: mariadb.auth.rootPassword
          persistence.enabled: mariadb.persistence.enabled
          persistence.size: mariadb.persistence.resources.requests.storage
          metrics.enabled: mariadb.metrics.enabled
          # mariadb chart's resources block lives under
          # podTemplates.containers.mariadb.resources (matches the
          # AppCo PodTemplate-based schema redis uses).
          resources.requests.cpu: mariadb.podTemplates.containers.mariadb.resources.requests.cpu
          resources.requests.memory: mariadb.podTemplates.containers.mariadb.resources.requests.memory
          resources.limits.cpu: mariadb.podTemplates.containers.mariadb.resources.limits.cpu
          resources.limits.memory: mariadb.podTemplates.containers.mariadb.resources.limits.memory
        auth_seed_paths:
          - auth.user.name
          - auth.user.password
          - auth.user.database
          - auth.admin.password
        binding_secret:
          - {key: type, literal: mariadb, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-mariadb"}
          - {key: port, literal: "3306"}
          # username/database stay SBS-canonical. user / name aliases
          # match the JDBC + mysql2 + sequelize + prisma idioms.
          - {key: username, from_dsl: auth.user.name, default: app, env_aliases: [user]}
          - {key: password, from_dsl: auth.user.password, required: true}
          - {key: database, from_dsl: auth.user.database, required: true, env_aliases: [name]}

        scaffold:
          auth.admin.password:
            default: ""
            comment: "admin (root) password — required"
          auth.user.name:
            default: "app"
            comment: "application user — your service connects as this"
          auth.user.password:
            default: ""
            comment: "application user password — required"
          auth.user.database:
            default: ""
            comment: "application database — required"
          persistence.enabled:
            default: false
          persistence.size:
            default: "1Gi"
          metrics.enabled:
            default: true
          resources.requests.cpu:
            default: "100m"
          resources.requests.memory:
            default: "256Mi"
          resources.limits.cpu:
            default: "500m"
          resources.limits.memory:
            default: "1Gi"

      - constraint: ">=20.0.0 <21.0.0"
        source: community
        # Bitnami mariadb 20.x. Same DSL surface as AppCo; only the
        # resources paths differ (primary.resources vs podTemplates).
        service:
          host: "{{ .Release.Name }}-mariadb.{{ .Release.Namespace }}.svc.cluster.local"
          port: 3306
        values_mapping:
