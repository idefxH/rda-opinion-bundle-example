  apache-kafka:
    # MADE FROM SCRATCH by SUSE (docs.apps.rancher.io/reference-guides/apache-kafka)
    sources:
      appco:
        chart_ref: oci://dp.apps.rancher.io/charts/apache-kafka
        requires_pull_secret: true
      community:
        chart_ref: oci://registry-1.docker.io/bitnamicharts/kafka
    versions:
      - constraint: ">=1.0.0 <2.0.0"
        source: appco
        # AppCo apache-kafka 1.x (KRaft mode, no zookeeper). Broker
        # service is <release>-apache-kafka-controller on 9092 (PLAINTEXT).
        # SASL / TLS are configurable via passthrough — the DSL surface
        # for kafka stays minimal: connect string + topic-level auth
        # don't fit the simple user/password shape.
        #
        # No auth_seed_paths: kafka stores no relational-style auth
        # baked into PVC; SASL credentials live in a Secret that the
        # operator manages. Persistence (KRaft metadata + topic logs)
        # IS data, but it's not auth state.
        service:
          host: "{{ .Release.Name }}-apache-kafka-controller.{{ .Release.Namespace }}.svc.cluster.local"
          port: 9092
        values_mapping:
          persistence.enabled: apache-kafka.broker.persistence.enabled
          persistence.size: apache-kafka.persistence.resources.requests.storage
          metrics.enabled: apache-kafka.metrics.enabled
          resources.requests.cpu: apache-kafka.controller.podTemplates.containers.controller.resources.requests.cpu
          resources.requests.memory: apache-kafka.controller.podTemplates.containers.controller.resources.requests.memory
          resources.limits.cpu: apache-kafka.controller.podTemplates.containers.controller.resources.limits.cpu
          resources.limits.memory: apache-kafka.controller.podTemplates.containers.controller.resources.limits.memory
        binding_secret:
          - {key: type, literal: apache-kafka, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-apache-kafka-controller"}
          - {key: port, literal: "9092"}
          # bootstrap_servers is the kafka-client convention (same
          # shape as KAFKA_BOOTSTRAP_SERVERS in containerised confluent
          # / strimzi clients). Single broker, port 9092 — overrides
          # via passthrough for multi-broker / SASL setups.
          - {key: bootstrap_servers, template: "{{ .Release.Name }}-apache-kafka-controller:9092"}

        scaffold:
          # Minimal DSL surface — kafka clients expect bootstrap-servers
          # + topic ACLs which don't fit the user/password shape. SASL +
          # multi-broker live in passthrough.
          persistence.enabled:
            default: false
          persistence.size:
            default: "1Gi"
          metrics.enabled:
            default: false
          resources.requests.cpu:
            default: "100m"
          resources.requests.memory:
            default: "512Mi"
          resources.limits.cpu:
            default: "1"
          resources.limits.memory:
            default: "1Gi"

      - constraint: ">=32.0.0 <33.0.0"
        source: community
        # Bitnami kafka 32.x. Same DSL surface as AppCo; only the
        # resources paths differ (flat resources vs podTemplates).
        service:
          host: "{{ .Release.Name }}-apache-kafka-controller.{{ .Release.Namespace }}.svc.cluster.local"
          port: 9092
        values_mapping:
          persistence.enabled: apache-kafka.broker.persistence.enabled
          persistence.size: apache-kafka.persistence.resources.requests.storage
          metrics.enabled: apache-kafka.metrics.enabled
          resources.requests.cpu: apache-kafka.resources.requests.cpu
          resources.requests.memory: apache-kafka.resources.requests.memory
          resources.limits.cpu: apache-kafka.resources.limits.cpu
          resources.limits.memory: apache-kafka.resources.limits.memory
        binding_secret:
          - {key: type, literal: apache-kafka, skip_env: true}
          - {key: provider, literal: rda-appco, skip_env: true}
          - {key: host, template: "{{ .Release.Name }}-apache-kafka-controller"}
          - {key: port, literal: "9092"}
          - {key: bootstrap_servers, template: "{{ .Release.Name }}-apache-kafka-controller:9092"}

        scaffold:
          persistence.enabled:
            default: false
          persistence.size:
