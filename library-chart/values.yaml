# Defaults for any chart depending on suse-library.

# --- Helm globals propagated to every sub-chart ---
# 'global.*' is special: Helm automatically merges it into every sub-chart's
# values regardless of nesting. Putting imagePullSecrets here means the
# AppCo postgresql sub-chart (and any future AppCo dep) sees it without
# us having to re-set it inside each aliased block.
#
# The 'application-collection' Secret is provisioned by the RDA Rancher
# Desktop extension (kubectl create secret docker-registry ...).
# Per AppCo docs (apps.rancher.io/applications/postgresql), the canonical
# install is:
#   helm install ... --set global.imagePullSecrets={application-collection}
global:
  imagePullSecrets:
    - application-collection

# --- application ---
name: ""
replicas: 1
port: 8080

image:
  repository: registry.suse.com/bci/bci-base
  tag: latest
  pullPolicy: IfNotPresent

# Pod-level pull secrets (for the application's own container, not the
# AppCo sub-charts — those pick up via global.imagePullSecrets above).
imagePullSecrets:
  - name: application-collection

resources:
  limits:   {cpu: "500m", memory: "512Mi"}
  requests: {cpu: "50m",  memory: "128Mi"}

probes:
  liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
  readiness: {path: /ready,  initialDelaySeconds: 5,  periodSeconds: 5}

# --- AppCo service: database (Postgres) ---
# Aliased as 'database' in suse-library/Chart.yaml. The values below are
# passed verbatim to the AppCo postgresql sub-chart. AppCo schema (NOT
# Bitnami): see https://apps.rancher.io/applications/postgresql.
#
# Resources deployed by the sub-chart are still named <release>-postgresql
# (alias renames the values key, not the chart's internal naming).
database:
  enabled: false
  auth:
    # Custom application user — credentials surface in the binding secret.
    # Required when enabled=true (no defaults).
    database: ""
    username: ""
    password: ""
  persistence:
    enabled: false       # ephemeral storage — flip to true for prod
  nodeCount: 1
