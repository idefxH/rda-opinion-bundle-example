# Defaults for any chart depending on suse-library v0.7.

# --- Helm globals propagated to every sub-chart ---
# 'global.*' is special: Helm automatically merges it into every
# sub-chart's values regardless of nesting. Keeping imagePullSecrets
# here means every AppCo dep picks it up without per-block repetition.
global:
  imagePullSecrets:
    - application-collection

# ─── Unified DSL (apiVersion: rda.suse.com/v1alpha1) ───
# When services[] is non-empty, the library renders binding-secrets and
# env vars from this list (the DSL view). When empty, the library falls
# back to the legacy <chart>.enabled gated path. See PROPOSAL.md in
# rda-devx-catalog for the design rationale.
#
# Each service entry MUST have:
#   binding: string (app-side env name root: <BINDING>_HOST etc.)
#   type:    string (AppCo chart name; v1alpha1 supports postgresql, redis, grafana)
# Plus type-specific auth/persistence/metrics/ingress/bootstrap fields per
# rda-devx-catalog/SCHEMA.md. The legacy <chart>.* blocks below remain in
# values.yaml for sub-chart resolution; the rda CLI pre-processor (Phase 1.5)
# will keep them in sync with services[].
apiVersion: rda.suse.com/v1alpha1
services: []


# --- application config ---
name: ""
replicas: 1
port: 8080

image:
  repository: registry.suse.com/bci/bci-base
  tag: latest
  pullPolicy: IfNotPresent

# Pod-level pull secrets for the application's OWN container.
imagePullSecrets:
  - name: application-collection

resources:
  limits:   {cpu: "500m", memory: "512Mi"}
  requests: {cpu: "50m",  memory: "128Mi"}

probes:
  liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
  readiness: {path: /ready,  initialDelaySeconds: 5,  periodSeconds: 5}

# ─── Prometheus scrape annotations (opinionated default) ───
# When metrics.enabled is true, the app pod is annotated with
#   prometheus.io/scrape: "true"
#   prometheus.io/path:   <metrics.path>      (default /metrics)
#   prometheus.io/port:   <metrics.port>      (default .Values.port)
# so the Prometheus chart's `kubernetes-pods` discovery picks it up
# automatically without any extra ServiceMonitor / PodMonitor config.
# Disable when your app does not expose a /metrics endpoint.
metrics:
  enabled: true
  path: /metrics
  # port: 8080  # defaults to .Values.port

# Free-form pod annotations merged into the Deployment's pod template.
# Use for app-specific concerns (Linkerd inject, Istio sidecar config,
# ingress-nginx auth annotations propagated to pods, etc.). Prometheus
# scrape annotations live in the metrics block above; setting the same
# keys here will override them.
podAnnotations: {}

# ─── Ingress (optional) ───
# When enabled, the library chart emits a single Ingress fronting the
# application Service. Path rules are simple by default — one path per
# host, all routed to the app's `http` port. Override `path`/`pathType`
# for a different routing convention; use `annotations` to plug into
# Traefik/nginx-specific behaviour (auth, rewrites, rate limits).
ingress:
  enabled: false
  ingressClassName: ""        # e.g. "traefik" on Rancher Desktop, "nginx" elsewhere
  hosts: []                   # e.g. - demo.localhost
  path: /
  pathType: Prefix
  annotations: {}
  tls: []                     # e.g. - {hosts: [demo.example.com], secretName: demo-tls}

# ─────────────────────────────────────────────────────────────────────
# CATALOGUE: AppCo charts the project can opt into
# ─────────────────────────────────────────────────────────────────────
# Each block below is keyed on the AppCo chart name (no alias). Setting
# <chart>.enabled: true pulls the chart at template time. The library
# chart issues:
#   - a Service Binding Spec Secret at <release>-<chart>-binding,
#     mounted at /bindings/<chart>/<key>
#   - 12-factor env vars projected from that Secret into the app
#     container, using <CHART>_HOST/_PORT/... naming
# The host always points at <release>-<chart>, which is what the
# AppCo sub-chart deploys (no alias renaming, the convention is direct).

postgresql:
  enabled: false
  auth:
    database: ""
    username: ""
    password: ""
  # Stateful service: persist by default so seeded data survives `tilt down`.
  # Reproduction risk is high otherwise — devs lose trust in the dev loop
  # when they rebuild and their data is gone. Refs bundle issue #7.
  # Override locally with `postgresql.persistence.enabled: false` for the
  # rare clean-slate-every-time workflow. Nuke accumulated PVCs across
  # re-installs with:
  #   kubectl delete pvc -l app.kubernetes.io/instance=<release>
  # Default size is 1Gi (down from the AppCo chart's 8Gi) — laptop-friendly.
  persistence:
    enabled: true
    size: 1Gi
  nodeCount: 1
  # Out-of-the-box monitoring is the opinion bundle's value prop. Setting
  # metrics.enabled: true at the library layer means downstream projects
  # get the postgres_exporter sidecar by default; the chart's own default
  # is false. Override locally with `postgresql.metrics.enabled: false`
  # if your project explicitly does not want it. Refs bundle issue #6.
  metrics:
    enabled: true

prometheus:
  enabled: false
  # Server is the only component we want by default in dev. The other
  # components from the Prometheus community chart (node-exporter,
  # alertmanager, pushgateway, kube-state-metrics) all bind hostPorts
  # or duplicate cluster-wide functions; on a single-node dev cluster
  # they collide with the system or with previous installs. Users can
  # opt them back in per-project via values overrides.
  server:
    persistentVolume:
      enabled: false
  # Auto-Ingress for the Prometheus UI. When prometheus.enabled is
  # true, the library renders an Ingress at prometheus.<release>.localhost
  # so the dev opens the expression browser from a browser without
  # configuring a host explicitly. Override:
  #   prometheus.ui.expose: false  # opt out
  #   prometheus.ui.host: "..."    # custom host
  # Refs bundle issue #8.
  ui:
    expose: true
  alertmanager:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false

grafana:
  enabled: false
  adminUser: admin
  adminPassword: ""
  persistence:
    enabled: false
  # Self-monitoring on by default (Grafana exposes /metrics for its own
  # process). Refs bundle issue #6 — out-of-the-box monitoring is the
  # opinion bundle's value prop.
  metrics:
    enabled: true
  # Auto-Ingress for the Grafana UI. When grafana.enabled is true, the
  # library renders an Ingress at grafana.<release>.localhost. Override:
  #   grafana.ui.expose: false  # opt out
  #   grafana.ui.host: "..."    # custom host
  # Refs bundle issue #8.
  ui:
    expose: true

# Disabled-by-default catch on `redis.enabled`. Helm dep `condition:`
# semantics: when the path is MISSING from values entirely, Helm treats
# the condition as 'no effect' and loads the dep regardless. So a missing
# default here would make every project pull redis even without
# `services[].type=redis` opting in. Closes a bug surfaced live: a
# project with only postgresql in services[] still saw payments-redis
# resources because nobody had explicitly written redis.enabled: false.
# rda render writes redis.enabled: true into the overlay only when an
# enabled redis service exists, so the user-facing default is off.
redis:
  enabled: false
