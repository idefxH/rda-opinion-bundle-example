# Defaults for any chart depending on suse-library v0.6.

# --- Helm globals propagated to every sub-chart ---
# 'global.*' is special: Helm automatically merges it into every
# sub-chart's values regardless of nesting. Keeping imagePullSecrets
# here means EVERY AppCo dep (postgresql, prometheus, grafana, ...)
# picks it up without per-block repetition.
global:
  imagePullSecrets:
    - application-collection

# --- application config ---
name: ""
replicas: 1
port: 8080

image:
  repository: registry.suse.com/bci/bci-base
  tag: latest
  pullPolicy: IfNotPresent

# Pod-level pull secrets (for the application's OWN container; AppCo
# sub-charts pick up via global.imagePullSecrets above).
imagePullSecrets:
  - name: application-collection

resources:
  limits:   {cpu: "500m", memory: "512Mi"}
  requests: {cpu: "50m",  memory: "128Mi"}

probes:
  liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
  readiness: {path: /ready,  initialDelaySeconds: 5,  periodSeconds: 5}

# ─────────────────────────────────────────────────────────────────────
# CATALOGUE: enabled services from SUSE Application Collection
# ─────────────────────────────────────────────────────────────────────
# Each block below is passed verbatim to its aliased AppCo sub-chart.
# Set <service>.enabled: true to include it. Resources deploy as
# <release>-<alias> (database, metrics, dashboard) thanks to Helm
# alias resolution (which the Tilt extension's chart-version
# alignment workaround makes work end-to-end).

# --- database (AppCo PostgreSQL, alias=database) ---
database:
  enabled: false
  auth:
    # Custom application user. Required when enabled=true.
    database: ""
    username: ""
    password: ""
  persistence:
    enabled: false       # ephemeral; flip to true for non-dev
  nodeCount: 1

# --- metrics (AppCo Prometheus, alias=metrics) ---
metrics:
  enabled: false
  # AppCo Prometheus exposes its API on port 9090 by default. Apps
  # reading the binding get METRICS_URL=http://<release>-metrics:9090.
  # Override server.* below to customize retention, scrape configs etc.
  server:
    persistentVolume:
      enabled: false   # ephemeral; flip to true for non-dev

# --- dashboard (AppCo Grafana, alias=dashboard) ---
dashboard:
  enabled: false
  # AppCo Grafana exposes its UI on port 3000. Apps reading the binding
  # get GRAFANA_URL=http://<release>-dashboard:3000 plus admin creds.
  # Default datasource: the metrics service if metrics.enabled=true.
  adminUser: admin
  adminPassword: ""    # required when enabled=true
  persistence:
    enabled: false     # ephemeral; flip to true for non-dev
