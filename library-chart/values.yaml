# Defaults for any chart depending on suse-library.

# Helm globals — propagated to every sub-chart automatically.
# Keeping imagePullSecrets here means every AppCo dep picks it up.
global:
  imagePullSecrets:
    - application-collection

# ─── Unified DSL ───
# services[] is the single source of truth for catalogued sub-charts.
# Each entry: { binding, type, enabled, auth?, persistence?, metrics?,
# ingress?, resources?, bootstrap?, passthrough?, overrides? }.
# `rda service add <type> <binding>` writes scaffold entries; the
# scaffold table in dsl-mappings.yaml drives the default shape per
# chart. See concepts/dsl.md and concepts/scaffolds.md in rda-docs.
services: []


# ─── Application config ───
name: ""
replicas: 1
port: 8080
domain: ""

image:
  repository: registry.suse.com/bci/bci-base
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: application-collection

resources:
  limits:   {cpu: "500m", memory: "512Mi"}
  requests: {cpu: "50m",  memory: "128Mi"}

probes:
  liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
  readiness: {path: /ready,  initialDelaySeconds: 5,  periodSeconds: 5}

# Prometheus scrape annotations on the app pod when metrics.enabled is true.
# The chart's `kubernetes-pods` discovery picks them up — no ServiceMonitor
# needed.
metrics:
  enabled: true
  path: /metrics
  # port: 8080  # defaults to .Values.port

# Free-form pod annotations (Linkerd inject, Istio sidecar, etc.).
podAnnotations: {}

# Application Ingress (one Ingress fronting the app's Service).
ingress:
  enabled: false
  ingressClassName: ""        # e.g. "traefik" on Rancher Desktop, "nginx" elsewhere
  hosts: []                   # e.g. - demo.localhost
  path: /
  pathType: Prefix
  annotations: {}
  tls: []                     # e.g. - {hosts: [demo.example.com], secretName: demo-tls}

# ─────────────────────────────────────────────────────────────────────
# Sub-chart enabled flags
# ─────────────────────────────────────────────────────────────────────
# Each <chart>.enabled defaults to false. `rda render` flips them to
# true in the generated overlay (deploy/.rda/values.generated.yaml)
# for every services[] entry with enabled: true and provisioning: deploy.
# The dev never writes these flags directly; they're internal plumbing
# between the unified DSL and Helm's `condition: <chart>.enabled` deps.
#
# Chart-specific values blocks (auth, persistence, etc.) below are
# Helm sub-chart defaults the dev's `services[]` entry overrides via
# values_mapping projection at render time.

postgresql:
  enabled: false
  auth:
    database: ""
    username: ""
    password: ""
  persistence:
    enabled: true
    size: 1Gi
  nodeCount: 1
  metrics:
    enabled: true

prometheus:
  enabled: false
  # Server only — node-exporter / alertmanager / pushgateway /
  # kube-state-metrics collide with the system on a single-node dev
  # cluster, so they're off by default. Re-enable per-project via
  # passthrough if needed.
  server:
    persistentVolume:
      enabled: false
  ui:
    expose: false
  alertmanager:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false

grafana:
  enabled: false
  adminUser: admin
  adminPassword: ""
  persistence:
    enabled: false
  metrics:
    enabled: true
  ui:
    expose: false

redis:
  enabled: false

dex:
  enabled: false
  # dex requires `config:` set or the pod crashloops at startup. The
  # `rda service add dex` scaffold writes a sane bootstrap config
  # (storage.memory + enablePasswordDB + oauth2 settings) via the
  # services[].passthrough block — no default needed here.

mariadb:
  enabled: false
  auth:
    rootPassword: ""
    database: ""
    username: ""
    password: ""
  persistence:
    resources:
      requests:
        storage: 1Gi
  nodeCount: 1
  metrics:
    enabled: true

apache-kafka:
  enabled: false

valkey:
  enabled: false

# MinIO: chart's own default `mode: distributed` (16 replicas × 500Gi)
# is overridden to `standalone` via dsl-mappings chart_defaults so a
# fresh project works on Rancher Desktop. Operators flip back to
# distributed via passthrough for production.
minio:
  enabled: false

# Vault: dev mode by default (in-memory, sealed=false, root token
# from devRootToken). Operators flip to raft/postgres via
# passthrough.server for production. Injector sidecar off by default.
vault:
  enabled: false

# Charts added in 0.11.39
etcd:
  enabled: false

nats:
  enabled: false

opensearch:
  enabled: false

influxdb:
  enabled: false

harbor:
  enabled: false

apache-airflow:
  enabled: false
