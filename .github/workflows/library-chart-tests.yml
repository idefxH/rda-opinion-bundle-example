# Run the library-chart invariant test suite on every PR and push to
# main. Each test in library-chart/tests/<name>/run.sh either passes,
# soft-skips when an optional dependency is missing (rda, pack CLI,
# docker daemon, network), or fails the job.
#
# `cnpg-operator-bundled` and a handful of helm-template-based tests
# need `helm` on PATH; the others only need python3 + PyYAML.
#
# Buildpack smoke (`template-pack-build-smoke`) is force-skipped via
# SKIP_PACK_SMOKE=1 — it needs a docker daemon and network access to
# pull buildpacks, neither of which is worth wiring into CI when the
# test is meant for pre-PR runs on a dev machine. The rest of the
# template-* tests are static / fast and run normally.
name: library-chart-tests

on:
  pull_request:
    paths:
      - 'library-chart/**'
      - 'templates/**'
      - 'rda-bundle.yaml'
      - 'service-catalog.yaml'
      - 'workload-shapes.yaml'
      - '.github/workflows/library-chart-tests.yml'
  push:
    branches: [main]

jobs:
  library-chart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Run library-chart invariant tests
        env:
          SKIP_PACK_SMOKE: '1'
        run: |
          set -euo pipefail
          fail=0
          for d in library-chart/tests/*/; do
            name=$(basename "$d")
            [ -f "$d/run.sh" ] || continue
            echo "::group::$name"
            if bash "$d/run.sh"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::endgroup::"
              echo "::error title=library-chart test failed::$name exited $rc"
              fail=$((fail+1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "$fail test(s) failed"
            exit 1
          fi
