# Project values for {{ .Name }} (worker / consumer).
#
# Worker: no HTTP server, no Service, no Ingress. The library chart
# renders a Deployment + binding-secrets + env wiring.
#
# Add backing services: rda service add <type> <binding>

suse-library:
  name: "{{ .Name }}"
  replicas: 1
  port: 8080

  ingress:
    enabled: false
  service:
    enabled: false

  image:
    repository: "{{ .Name }}"
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  probes:
    liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
    readiness: null

  env: {}

