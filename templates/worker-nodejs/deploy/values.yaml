# Project values for {{ .Name }} (worker / consumer).
#
# Worker: no HTTP server, no Service, no Ingress. The library chart
# renders a Deployment + binding-secrets + env wiring.
#
# Add backing services: rda service add <type> <binding>

suse-library:
  name: "{{ .Name }}"

  {{ .ImagePullSecrets }}

  workloads:
    - name: app
      shape: worker
      image:
        repository: "{{ .Name }}"
        tag: dev
        pullPolicy: IfNotPresent
      env: {}
