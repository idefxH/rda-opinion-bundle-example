# Project values for {{ .Name }} (worker).
#
# Worker: no HTTP server, no Service, no Ingress.
#
# Add backing services: rda service add <type> <binding>

suse-library:
  name: "{{ .Name }}"

  imagePullSecrets:
    - name: application-collection

  workloads:
    - name: app
      shape: worker
      image:
        repository: "{{ .Name }}"
        tag: dev
        pullPolicy: IfNotPresent
      env: {}
