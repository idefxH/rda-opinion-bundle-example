apiVersion: v2
name: {{ .Name }}
description: {{ .Name }} — generated by rda from the web-nodejs template. Consumes the SUSE library chart for deployment, service, and Service Binding Specification wiring.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
