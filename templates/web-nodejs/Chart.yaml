apiVersion: v2
name: {{ .Name }}
description: {{ .Name }} — generated by rda from the web-nodejs template
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [rda, {{ .Language }}]

dependencies:
  - name: suse-library
    version: 0.6.0
    # Vendored at charts/suse-library/. The library chart references
    # AppCo charts (postgresql=database, prometheus=metrics,
    # grafana=dashboard). The Tilt extension's helm-dep recursive
    # update + chart-version alignment makes the alias propagation work.
