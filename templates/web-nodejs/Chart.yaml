apiVersion: v2
name: {{ .Name }}
description: {{ .Name }} — generated by rda from the web-nodejs template
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [rda, {{ .Language }}]

dependencies:
  - name: suse-library
    version: 0.5.0
    # Vendored at charts/suse-library/. The library chart in turn depends
    # on AppCo charts (postgresql aliased as 'database', etc.). The Tilt
    # extension's helm dep update recurses one level so suse-library's
    # AppCo deps are pulled before the parent's helm template runs.
