apiVersion: v2
name: {{ .Name }}
description: {{ .Name }} — generated by rda from the web-nodejs template
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [rda, {{ .Language }}]

dependencies:
  - name: suse-library
    version: 0.3.0
    # Vendored at charts/suse-library/ — no remote repository needed
  - name: postgresql
    version: "0.4.4-29.1"
    repository: oci://dp.apps.rancher.io/charts
    alias: database          # resources are named <release>-database
    condition: database.enabled
