apiVersion: v2
name: {{ .Name }}
description: {{ .Name }} — generated by rda from the web-nodejs template
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [rda, {{ .Language }}]

dependencies:
  - name: suse-library
    version: 0.11.0
    # Vendored at charts/suse-library/. The library chart references
    # AppCo charts by their real name (postgresql, prometheus, grafana,
    # ...) — toggle each one via suse-library.<chart>.enabled in
    # values.yaml. The Tilt extension's chart-version alignment +
    # recursive helm dep update make the multi-level resolution work.
