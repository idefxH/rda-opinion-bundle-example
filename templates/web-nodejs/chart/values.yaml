# Project values for {{ .Name }}.
#
# This template is DSL-first (suse-library v0.11.0+). To attach a
# backing service (postgres, redis, grafana, ...), use:
#
#   rda add-service postgresql payments-db
#
# It writes a `services[]` entry below AND auto-flips
# `<chart>.enabled: true` for Helm dep resolution. Both halves are
# required: services[] drives the DSL helpers (Secret + env wiring),
# and <chart>.enabled gates the AppCo sub-chart deployment in
# library-chart's Chart.yaml.
#
# Edit the auth/persistence/metrics blocks under each service entry
# to taste — defaults are dev-tuned, not prod.

suse-library:
  name: {{ .Name }}
  replicas: 1
  port: 8080

  # ─── Ingress (cluster Traefik / FIPS variant) ──────────────────────
  # The library auto-renders an Ingress when this block is present.
  # Default host {{ .Name }}.localhost resolves on macOS / Rancher
  # Desktop without /etc/hosts edits; change for staging+.
  ingress:
    enabled: true
    hosts: [{{ .Name }}.localhost]

  image:
    repository: {{ .Name }}
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  # ─── Backing services ──────────────────────────────────────────────
  # Add via `rda add-service <type> <binding>`. Example for the
  # bundled example app (which discovers a postgresql binding by
  # type — see src/index.js findBindingByType):
  #
  # services:
  #   - binding: payments-db
  #     type: postgresql
  #     auth:
  #       user:
  #         name: app
  #         password: ""        # FILL IN — required, no default
  #         database: payments
  #     persistence:
  #       enabled: true
  #       size: 1Gi
  #     metrics:
  #       enabled: true
  #     resources:
  #       requests: { cpu: 100m, memory: 256Mi }
  #       limits:   { cpu: 500m, memory: 1Gi }
  services: []
