apiVersion: v1
kind: Service
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "suse-library.selectorLabels" . | nindent 4 }}
