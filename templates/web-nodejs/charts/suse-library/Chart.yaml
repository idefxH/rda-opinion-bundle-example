apiVersion: v2
name: suse-library
description: |
  SUSE Rancher Developer Access library chart. Provides the application
  Deployment, Service, and Service Binding Specification wiring. It does
  NOT bundle service sub-charts — projects declare their own service
  dependencies (typically as aliased AppCo charts) at the project level
  so a single `helm dependency update` resolves the full graph.
type: application
version: 0.3.0
appVersion: "1.0"
keywords: [suse, rda, library, service-binding]
home: https://github.com/idefxH/rda-opinion-bundle-example
maintainers:
  - {name: idefxH, email: fx.houard@gmail.com}
