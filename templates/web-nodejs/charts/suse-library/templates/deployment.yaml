apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            - {name: PORT, value: "{{ .Values.port }}"}
          {{- if .Values.bindings }}
          volumeMounts:
            {{- range $name, $_ := .Values.bindings }}
            - name: binding-{{ $name }}
              mountPath: /bindings/{{ $name }}
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: http}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: http}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      {{- if .Values.bindings }}
      volumes:
        {{- range $name, $_ := .Values.bindings }}
        - name: binding-{{ $name }}
          secret:
            secretName: {{ include "suse-library.name" $ }}-{{ $name }}-binding
        {{- end }}
      {{- end }}
