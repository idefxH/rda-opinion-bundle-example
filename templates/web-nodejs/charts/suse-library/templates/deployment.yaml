apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suse-library.name" . }}
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "suse-library.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "suse-library.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
          env:
            # Service Binding Spec mount root — apps that follow SBS
            # discover bindings under /bindings/<name>/<key>.
            - {name: SERVICE_BINDING_ROOT, value: /bindings}
            # 12-factor app port — the chart owns this; user code MUST
            # respect process.env.PORT or the K8s probes won't match.
            - {name: PORT, value: "{{ .Values.port }}"}
            {{- if .Values.database.enabled }}
            # 12-factor convenience aliases for the database binding.
            # Apps that just want DB_* env vars get them; apps that want
            # SBS read /bindings/database/* directly. Both work.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-database-binding
                  key: database
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # Prometheus URL the app can use to push or query metrics.
            - name: PROMETHEUS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-metrics-binding
                  key: url
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            # Grafana endpoint + admin creds for apps that auto-provision
            # dashboards on boot.
            - name: GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-dashboard-binding
                  key: url
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-dashboard-binding
                  key: adminUser
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "suse-library.name" . }}-dashboard-binding
                  key: adminPassword
            {{- end }}
          volumeMounts:
            {{- if .Values.database.enabled }}
            - name: binding-database
              mountPath: /bindings/database
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: binding-metrics
              mountPath: /bindings/metrics
              readOnly: true
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - name: binding-dashboard
              mountPath: /bindings/dashboard
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: http}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: http}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.database.enabled }}
        - name: binding-database
          secret:
            secretName: {{ include "suse-library.name" . }}-database-binding
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: binding-metrics
          secret:
            secretName: {{ include "suse-library.name" . }}-metrics-binding
        {{- end }}
        {{- if .Values.dashboard.enabled }}
        - name: binding-dashboard
          secret:
            secretName: {{ include "suse-library.name" . }}-dashboard-binding
        {{- end }}
