{{/*
Service Binding Specification secrets for each enabled service. Mounted
at /bindings/<binding-name>/ in the application container by deployment.yaml.

The host points at the actual K8s Service the AppCo sub-chart deploys.
The postgresql sub-chart is aliased as 'database' in suse-library
Chart.yaml. With proper Helm alias resolution (relying on the Tilt
extension's chart-version alignment workaround), the sub-chart renders
its resources as <release>-database (alias-prefixed), not as
<release>-postgresql. So the binding host points at <release>-database.
*/}}

{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suse-library.name" . }}-database-binding
  labels:
    {{- include "suse-library.labels" . | nindent 4 }}
    service.binding/binding-name: database
type: Opaque
stringData:
  type: postgresql
  provider: rda-appco
  host: "{{ .Release.Name }}-database"
  port: "5432"
  username: {{ required "database.auth.username is required when database.enabled=true" .Values.database.auth.username | quote }}
  password: {{ required "database.auth.password is required when database.enabled=true" .Values.database.auth.password | quote }}
  database: {{ required "database.auth.database is required when database.enabled=true" .Values.database.auth.database | quote }}
{{- end }}
