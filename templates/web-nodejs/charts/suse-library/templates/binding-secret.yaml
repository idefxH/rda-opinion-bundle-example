{{/*
Binding secrets in Service Binding Specification format. One per declared
service whose provider is "local". Populated from the corresponding
sub-chart's auth values.

The host name follows the AppCo Postgres chart's release naming convention:
<release-name>-postgresql (which is also Bitnami's convention).
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and (eq $svc.type "postgresql") (eq $svc.provider "local") }}
{{- if $.Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suse-library.name" $ }}-{{ $name }}-binding
  labels:
    {{- include "suse-library.labels" $ | nindent 4 }}
    service.binding/provisioner: rda-appco-postgres
type: Opaque
stringData:
  type: postgresql
  provider: rda-appco
  host: {{ $.Release.Name }}-postgresql
  port: "5432"
  username: {{ $.Values.postgresql.auth.username }}
  password: {{ $.Values.postgresql.auth.password }}
  database: {{ $.Values.postgresql.auth.database }}
{{- end }}
{{- end }}
{{- end }}
