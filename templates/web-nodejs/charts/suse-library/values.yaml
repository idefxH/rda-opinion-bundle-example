# Defaults for any chart depending on suse-library.

# --- application ---
name: ""
replicas: 1
port: 8080

image:
  repository: registry.suse.com/bci/bci-base
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: application-collection

resources:
  limits:   {cpu: "500m", memory: "512Mi"}
  requests: {cpu: "50m",  memory: "128Mi"}

probes:
  liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
  readiness: {path: /ready,  initialDelaySeconds: 5,  periodSeconds: 5}

# --- AppCo service: database (Postgres) ---
# Set enabled: true to provision the AppCo Postgres chart aliased as 'database'.
# The library's binding-secret template generates the Service Binding Spec
# Secret at <release>-database-binding from these values, kept consistent
# with what the postgresql sub-chart actually deploys.
database:
  enabled: false
  # Bitnami chart names resources <release>-<chart-name>; override so the
  # postgresql sub-chart deploys as <release>-database (matching the alias
  # in suse-library's Chart.yaml dependency entry).
  nameOverride: database
  global:
    imagePullSecrets:
      - application-collection
  primary:
    persistence:
      enabled: false       # ephemeral storage — flip to true for prod
  auth:
    username: app
    password: ""           # required when enabled=true; no default — must be set
    database: app
