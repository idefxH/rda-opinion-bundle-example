# Defaults for any chart depending on suse-library. A consuming chart's
# values.yaml overrides these.

# --- application ---
name: ""
replicas: 1
port: 8080

image:
  repository: registry.suse.com/bci/bci-base
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: application-collection

resources:
  limits: {cpu: "500m", memory: "512Mi"}
  requests: {cpu: "50m", memory: "128Mi"}

probes:
  liveness:  {path: /health, initialDelaySeconds: 10, periodSeconds: 10}
  readiness: {path: /ready,  initialDelaySeconds: 5,  periodSeconds: 5}

# --- bindings ---
# Each entry produces a Secret in Service Binding Specification format
# at <release>-<key>-binding, mounted at /bindings/<key>/ in the app
# container. The values below populate that Secret directly. The user is
# responsible for ensuring the host/port/credentials match an actually-
# deployed service (typically a sub-chart aliased to the same key in the
# parent chart's Chart.yaml).
bindings: {}
# Example:
# bindings:
#   database:
#     type: postgresql
#     provider: rda-appco
#     host: "{{ .Release.Name }}-database"
#     port: "5432"
#     username: app
#     password: localdev-do-not-use-in-prod
#     database: app
