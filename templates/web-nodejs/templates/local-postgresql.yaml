{{- range $name, $svc := .Values.services }}
{{- if and (eq $svc.type "postgresql") (eq $svc.provider "local") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" $ }}-{{ $name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" $ }}-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" $ }}-{{ $name }}
    spec:
      containers:
        - name: postgres
          image: "dp.apps.rancher.io/containers/postgresql:15.17-26.1"
          env:
            - name: POSTGRES_DB
              value: {{ include "app.name" $ }}
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: localdev-do-not-use-in-prod
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" $ }}-{{ $name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "app.name" $ }}-{{ $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.name" $ }}-{{ $name }}-binding
  labels:
    {{- include "app.labels" $ | nindent 4 }}
type: Opaque
stringData:
  type: postgresql
  provider: rda-local
  host: {{ include "app.name" $ }}-{{ $name }}
  port: "5432"
  username: app
  password: localdev-do-not-use-in-prod
  database: {{ include "app.name" $ }}
{{- end }}
{{- end }}
