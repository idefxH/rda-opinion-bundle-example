# Project values for {{ .Name }}.
#
# Toggle services on under suse-library:.<chart>:.enabled. Each block
# is the AppCo chart's own values schema — refer to AppCo docs for
# what each chart accepts.

suse-library:
  name: {{ .Name }}
  replicas: 1
  port: 8080

  image:
    repository: {{ .Name }}
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  # ─── postgresql ────────────────────────────────────────────────────
  # When enabled, the app receives:
  #   /bindings/postgresql/<key>             (Service Binding Spec)
  #   POSTGRESQL_HOST/PORT/USER/PASSWORD/DATABASE  (12-factor)
  #   DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME  (semantic SQL alias)
  postgresql:
    enabled: true
    auth:
      username: app
      password: localdev-do-not-use-in-prod
      database: {{ .Name }}

  # ─── prometheus ────────────────────────────────────────────────────
  # Uncomment to add Prometheus to your dev loop. App gets:
  #   /bindings/prometheus/url
  #   PROMETHEUS_URL=http://<release>-prometheus-server:9090
  # prometheus:
  #   enabled: true

  # ─── grafana ───────────────────────────────────────────────────────
  # Uncomment for Grafana. App gets:
  #   /bindings/grafana/{url,adminUser,adminPassword}
  #   GRAFANA_URL/GRAFANA_ADMIN_USER/GRAFANA_ADMIN_PASSWORD
  # grafana:
  #   enabled: true
  #   adminUser: admin
  #   adminPassword: localdev-do-not-use-in-prod
