# Project values for {{ .Name }}.

# --- suse-library sub-chart values (the application + binding secrets) ---
suse-library:
  name: {{ .Name }}
  replicas: 1
  port: 8080

  image:
    repository: {{ .Name }}
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  # Binding secrets generated by suse-library, one per entry. host points
  # at the deployed service name (matches the sub-chart alias below).
  bindings:
    database:
      type: postgresql
      provider: rda-appco
      host: "{{`{{ .Release.Name }}`}}-database"
      port: "5432"
      username: app
      password: localdev-do-not-use-in-prod
      database: {{ .Name }}

# --- postgresql sub-chart (aliased to database) — provisions the actual Postgres ---
# Set enabled: false (and remove the binding above) to disable.
database:
  enabled: true
  global:
    imagePullSecrets:
      - application-collection
  primary:
    persistence:
      enabled: false
  auth:
    username: app
    password: localdev-do-not-use-in-prod
    database: {{ .Name }}
