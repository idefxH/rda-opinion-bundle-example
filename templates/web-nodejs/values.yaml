# Project values for {{ .Name }}.
#
# All knobs live under suse-library:. Toggle services on/off via
# <service>.enabled: true|false. The library chart owns the catalogue;
# this file just opts in.

suse-library:
  name: {{ .Name }}
  replicas: 1
  port: 8080

  image:
    repository: {{ .Name }}
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  # Approved service: PostgreSQL via AppCo. Single toggle: enabled: true.
  # Auth values populate BOTH the postgresql sub-chart's runtime config
  # AND the Service Binding Spec secret mounted into the app container.
  database:
    enabled: true
    nameOverride: database  # makes resources <release>-database
    auth:
      username: app
      password: localdev-do-not-use-in-prod
      database: {{ .Name }}
