# Project values. Edit fields under `suse-library:` to customize. The sub-chart
# at charts/suse-library/ provides the Deployment, Service, Service Binding
# Spec wiring, and pulls AppCo sub-charts (e.g. PostgreSQL) when their
# `<name>.enabled` flag is true.

suse-library:
  name: {{ .Name }}
  replicas: 1
  port: 8080

  image:
    repository: {{ .Name }}
    tag: dev
    pullPolicy: IfNotPresent

  # Default imagePullSecret name. Created by the SUSE Application Collection
  # extension in Rancher Desktop. If your environment doesn't auto-create
  # it, run:
  #   kubectl create secret docker-registry application-collection \
  #     --docker-server=dp.apps.rancher.io \
  #     --docker-username='YOUR_SCC_USERNAME' \
  #     --docker-password='YOUR_SCC_PASSWORD'
  imagePullSecrets:
    - name: application-collection

  services:
    database:
      type: postgresql
      provider: local

  # AppCo PostgreSQL sub-chart (transitive: project → suse-library → postgresql).
  # Set enabled: true to provision a local Postgres via the AppCo chart.
  postgresql:
    enabled: true
    global:
      imagePullSecrets:
        - application-collection
    primary:
      persistence:
        enabled: false  # ephemeral for inner-loop dev
    auth:
      database: {{ .Name }}
      username: app
      password: localdev-do-not-use-in-prod
