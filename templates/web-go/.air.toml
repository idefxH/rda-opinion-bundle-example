# air (https://github.com/air-verse/air) config for live-reload.
# Built-in to the dev launch process via the Procfile.
#
# Watches every .go file under the project root, recompiles + reruns
# on save. Tilt's live_update sync drops changed files into
# /workspace/, air sees the change, kills the old process, builds a
# fresh binary, and re-execs. Sub-2s round-trip vs ~14s for a full
# `pack build` rebuild.

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ."
  delay = 100              # ms — coalesce rapid saves
  exclude_dir = ["assets", "tmp", "vendor", "deploy"]
  exclude_regex = ["_test\\.go"]
  follow_symlink = false
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"     # SIGTERM grace
  log = "build-errors.log"
  send_interrupt = true    # SIGINT before SIGKILL
  stop_on_error = false    # keep watching even after a compile error

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false
