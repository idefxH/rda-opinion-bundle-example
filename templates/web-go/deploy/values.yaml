# Project values for {{ .Name }}.
#
# Add backing services:  rda add-service <type> <binding>
# Wire datasources:      rda add-datasource <source> --to <consumer>
# Bootstrap auth:        rda bootstrap auth.clients init --binding <b>
#
# `rda render` projects services[] into .rda/values.generated.yaml.
# Don't edit values.generated.yaml — it's overwritten on each render.

suse-library:
  name: "{{ .Name }}"
  replicas: 1
  port: 8080

  ingress:
    enabled: true
    hosts:
      - "{{ .Name }}.localtest.me"

  image:
    repository: "{{ .Name }}"
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  # Env vars projected into your container. `rda add-service` scaffolds
  # entries here automatically. Values use ${binding:NAME.field} syntax
  # — resolved at render time from the binding-secret.
  env: {}

