apiVersion: v2
name: {{ .Name }}
description: {{ .Name }} — generated by rda from the web-go template
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [rda, {{ .Language }}]

dependencies:
  - name: suse-library
    version: 0.11.22
    # Vendored at charts/suse-library/. Catalogued sub-charts
    # (postgresql, redis, prometheus, ...) are opted into via the
    # unified DSL `services[]` block in deploy/values.yaml — `rda
    # render` projects each entry into the chart-specific values
    # under deploy/.rda/values.generated.yaml. The Tilt extension
    # runs that render before each `helm dep update` and aligns
    # AppCo's OCI tag → internal version so multi-level resolution
    # works.
