# Project values for {{ .Name }}.
#
# Add backing services:  rda service add <type> <binding>

suse-library:
  name: "{{ .Name }}"
  domain: "localtest.me"

  ingress:
    enabled: true
    hosts:
      - "{{ .Name }}.{{.domain}}"

  imagePullSecrets:
    - name: application-collection

  workloads:
    - name: app
      image:
        repository: "{{ .Name }}"
        tag: dev
        pullPolicy: IfNotPresent
      port: 8080
      env: {}
