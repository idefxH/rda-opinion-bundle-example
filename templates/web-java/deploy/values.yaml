# Project values for {{ .Name }}.
#
# Add backing services:  rda service add <type> <binding>

suse-library:
  name: "{{ .Name }}"
  replicas: 1
  port: 8080
  domain: "localtest.me"

  ingress:
    enabled: true
    hosts:
      - "{{ .Name }}.{{.domain}}"

  image:
    repository: "{{ .Name }}"
    tag: dev
    pullPolicy: IfNotPresent

  imagePullSecrets:
    - name: application-collection

  env: {}

