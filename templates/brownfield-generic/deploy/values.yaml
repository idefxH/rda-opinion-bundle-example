# Project values for {{ .Name }}.
#
# Add backing services:  rda service add <type> <binding>
# Wire datasources:      rda service wire <source> --to <consumer>
#
# `rda render` projects services[] into .rda/values.generated.yaml.
# Don't edit values.generated.yaml — it's overwritten on each render.

suse-library:
  name: "{{ .Name }}"
  domain: "localtest.me"

  ingress:
    enabled: true
    hosts:
      - "{{ .Name }}.{{.domain}}"

  imagePullSecrets:
    - name: application-collection

  workloads:
    - name: app
      image:
        repository: "{{ .Name }}"
        tag: dev
        pullPolicy: IfNotPresent
      port: 8080
      env: {}
