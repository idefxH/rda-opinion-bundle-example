apiVersion: rda.suse.com/v1
kind: OpinionBundle
metadata:
  name: rda-opinion-bundle-example
  version: 0.1.0
  description: Reference example bundle for the rda CLI

spec:
  templates:
    - id: web-nodejs
      display_name: Web Service (Node.js)
      language: nodejs
      description: |
        Express-based web service ready to bind a Postgres service via the
        Kubernetes Service Binding Specification. Includes a Tiltfile for
        inner-loop development on Rancher Desktop.
      path_in_bundle: templates/web-nodejs

  library_chart:
    # v1: file:// URI relative to bundle root. The rda HelmClient.PullChart
    # production implementation supports file:// URIs only — see the v1-gap
    # issue tracking oci:// support.
    oci_ref: file://library-chart
    version: 0.1.0

  service_catalog:
    - type_name: postgresql
      local_chart_ref: file://library-chart
