# rda-bundle.yaml — manifest for the rda CLI.
# Schema: top-level fields `templates`, `library_chart`, `service_catalog`
# (matches BEHAVIOR/INTERNAL: load-opinion-bundle in the rda spec).

templates:
  - id: web-nodejs
    display_name: Web Service (Node.js)
    language: nodejs
    description: |
      Express-based web service ready to bind PostgreSQL (via the Service
      Binding Specification + 12-factor env vars), and optionally
      Prometheus and Grafana from the SUSE Application Collection.
      Includes a Tiltfile for inner-loop development on Rancher Desktop.
    path_in_bundle: templates/web-nodejs

library_chart:
  # v1: file:// URI relative to bundle root. The rda HelmClient.PullChart
  # production implementation supports file:// URIs only — see the v1-gap
  # issue tracking oci:// support.
  #
  # IMPORTANT: this version MUST match library-chart/Chart.yaml's version
  # field. `rda upgrade` reads its target from THIS manifest (the bundle
  # claims version X), not from library-chart/Chart.yaml directly. If the
  # two drift, `rda upgrade` silently lies: it'll say "already up to date"
  # at the manifest's stale version while the actual library is newer.
  # CONTRIBUTING.md mandates bumping both files in the same commit, and a
  # follow-up test asserting equality is filed against the bundle.
  oci_ref: file://library-chart
  version: 0.11.8

# Catalogue surfaced by the library chart. Each AppCo chart is referenced
# by its real name (no alias). The local_chart_ref points at the bundled
# library chart that wires the SBS / 12-factor projections on top.
service_catalog:
  - type_name: postgresql
    local_chart_ref: file://library-chart
  - type_name: prometheus
    local_chart_ref: file://library-chart
  - type_name: grafana
    local_chart_ref: file://library-chart
