# rda-bundle.yaml — manifest for the rda CLI.
# Schema: top-level fields `templates`, `library_chart`, `service_catalog`
# (matches BEHAVIOR/INTERNAL: load-opinion-bundle in the rda spec).

templates:
  - id: web-nodejs
    display_name: Web Service (Node.js)
    language: nodejs
    description: |
      Express-based web service ready to bind PostgreSQL (via the Service
      Binding Specification + 12-factor env vars), and optionally
      Prometheus and Grafana from the SUSE Application Collection.
      Includes a Tiltfile for inner-loop development on Rancher Desktop.
    path_in_bundle: templates/web-nodejs
  - id: web-go
    display_name: Web Service (Go)
    language: go
    description: |
      Net/http-based web service ready to bind any catalogued backing
      service (PostgreSQL / MariaDB / Redis / Apache Kafka) via the
      Kubernetes Service Binding Specification. Multi-stage Dockerfile
      using SUSE Application Collection Go images: dev variant for
      compilation, slim variant for runtime. Static CGO_DISABLED binary,
      runs as UID 1000.
    path_in_bundle: templates/web-go
  - id: worker-nodejs
    display_name: Worker / Consumer (Node.js)
    language: nodejs
    description: |
      Long-running background worker — no HTTP server, no Service, no
      Ingress. Heartbeat loop logs each binding under /bindings/ at
      startup. The natural template for queue consumers (Kafka, Redis
      pub/sub), cron-style schedulers, and sidecars that don't accept
      inbound traffic. Pair with `rda service add apache-kafka events`
      or `rda service add redis events-bus` for an actual consumer.
    path_in_bundle: templates/worker-nodejs
  - id: web-java
    display_name: Web Service (Java)
    language: java
    description: |
      Plain Java 21 HTTP server ready to bind any catalogued backing
      service via the Kubernetes Service Binding Specification. Maven
      build, heroku/java buildpack via CNB. SUSE Application Collection
      Java images for production.
    path_in_bundle: templates/web-java
  - id: web-java-gradle
    display_name: Web Service (Java / Gradle)
    language: java
    description: |
      Java 21 HTTP server with Gradle build. Same as web-java but uses
      build.gradle instead of pom.xml.
    path_in_bundle: templates/web-java-gradle
  - id: worker-go
    display_name: Worker / Consumer (Go)
    language: go
    description: |
      Long-running Go background worker — no HTTP server, no Service,
      no Ingress. Heartbeat loop discovers bindings at startup. Natural
      fit for queue consumers (Kafka, Redis pub/sub), cron schedulers,
      and data pipeline processors.
    path_in_bundle: templates/worker-go
  - id: worker-java
    display_name: Worker / Consumer (Java)
    language: java
    description: |
      Java 21 background worker — no HTTP server, no Service, no Ingress.
      Natural fit for Kafka consumers, batch processors, schedulers.
    path_in_bundle: templates/worker-java
  - id: brownfield-generic
    display_name: Brownfield (existing source code)
    language: auto
    description: |
      Add RDA deployment to an existing project with source code.
      Language auto-detected from project files. Build via pack.
      Scaffolds deploy/, Tiltfile, .rda/ — source code untouched.
    path_in_bundle: templates/brownfield-generic
  - id: brownfield-image
    display_name: Brownfield (pre-built image)
    language: none
    description: |
      Deploy a pre-built container image on Kubernetes with RDA backing
      service management. No build step — just helm deploy.
      Scaffolds deploy/, Tiltfile, .rda/.
    path_in_bundle: templates/brownfield-image
  - id: brownfield-helm
    display_name: Brownfield (existing Helm chart)
    language: none
    description: |
      Add RDA backing service management to an existing Helm chart.
      Scaffolds only the suse-library values block and .rda/.
      No Tiltfile, no Chart.yaml — user has their own.
    path_in_bundle: templates/brownfield-helm
  - id: multi-workload
    display_name: Multi-Workload (API + Worker)
    language: auto
    description: |
      Two-workload project: API server + background worker sharing the
      same services[] bindings. One chart, one values.yaml, one deploy.
    path_in_bundle: templates/multi-workload
  - id: infra-only
    display_name: Infrastructure Only (services, no app)
    language: none
    description: |
      Deploy a complete backing services environment without any app
      workload. Helm-as-Terraform: one install gives you the whole
      services stack. Apps connect via provisioning: connect.
    path_in_bundle: templates/infra-only
library_chart:
  # v1: file:// URI relative to bundle root. The rda HelmClient.PullChart
  # production implementation supports file:// URIs only — see the v1-gap
  # issue tracking oci:// support.
  oci_ref: file://library-chart
  version: 0.15.0
# Tilt extension version. Injected into scaffolded Tiltfiles at
# `rda new` time. `rda upgrade` bumps existing Tiltfiles when this
# changes. Single source of truth for the extension ref — templates
# no longer carry hardcoded version strings.
tilt_extension:
  url: https://github.com/idefxH/tilt-extension-suse-rda
  ref: v0.5.0
# Catalogue surfaced by the library chart. Each AppCo chart is referenced
# by its real name (no alias). The local_chart_ref points at the bundled
# library chart that wires the SBS / 12-factor projections on top.
service_catalog:
  - type_name: postgresql
    local_chart_ref: file://library-chart
  - type_name: prometheus
    local_chart_ref: file://library-chart
  - type_name: grafana
    local_chart_ref: file://library-chart
  - type_name: dex
    local_chart_ref: file://library-chart
  - type_name: mariadb
    local_chart_ref: file://library-chart
  - type_name: apache-kafka
    local_chart_ref: file://library-chart
  - type_name: valkey
    local_chart_ref: file://library-chart
  - type_name: minio
    local_chart_ref: file://library-chart
  - type_name: vault
    local_chart_ref: file://library-chart
  - type_name: etcd
    local_chart_ref: file://library-chart
  - type_name: nats
    local_chart_ref: file://library-chart
  - type_name: opensearch
    local_chart_ref: file://library-chart
  - type_name: influxdb
    local_chart_ref: file://library-chart
  - type_name: harbor
    local_chart_ref: file://library-chart
  - type_name: apache-airflow
    local_chart_ref: file://library-chart
  - type_name: oauth2-proxy
    local_chart_ref: file://library-chart
